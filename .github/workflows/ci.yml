name: CI

on:
  push:
  pull_request:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "pyyaml>=6" "pytest>=8"
      - run: python -m pytest
      - run: python tools/validate_registry.py
