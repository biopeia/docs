name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # A unit becomes stale when a domain repository changes, not when this one
  # does, so the staleness report is also produced once a day.
  schedule:
    - cron: "17 5 * * *"

defaults:
  run:
    shell: bash

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "pyyaml>=6" "pytest>=8"
      - run: python -m pytest
      - run: python tools/validate_registry.py
      - run: python tools/render_units.py --check

  cross-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
          owner: biopeia
          repositories: organism,embodiment,environment,world,modality,observation,lab
      - name: Check out the domain repositories
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh auth setup-git
          for repo in organism embodiment environment world modality observation lab; do
            git clone --quiet "https://github.com/biopeia/$repo" "$RUNNER_TEMP/repos/$repo"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "pyyaml>=6"
      # References into the domain repositories must resolve; this blocks.
      # Staleness is reported in the job summary and does not block.
      - run: |
          python tools/validate_registry.py --repos-root "$RUNNER_TEMP/repos" --stale --coverage \
            | tee -a "$GITHUB_STEP_SUMMARY"
