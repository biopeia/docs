schema_version: 1

# Conceptual distinctions that recur across the documentation.
terms:

  causal-record:
    term: "Causal record"
    definition: >
      An immutable envelope for one World-scoped causal event: its identifier,
      World, causal tick, opaque type, optional actor, JSON-compatible payload
      and the identifiers of related records. The journal that holds it does
      not interpret its type or payload.
    distinguishes_from:
      - causal-tick
    owners:
      - component.world-causal-journal
    canonical_refs:
      - explanation/world/causal-journal.md

  causal-tick:
    term: "Causal tick"
    definition: >
      The count of transitions a World has committed. It is the only clock the
      causal journal carries. It is not host wall-clock time, and one tick may
      in principle carry more than one causal record.
    distinguishes_from:
      - causal-record
    owners:
      - component.world-causal-journal
    canonical_refs:
      - explanation/world/causal-journal.md

  causal-cut:
    term: "Causal cut"
    definition: >
      The set of owner states and the journal position that belong together at
      one committed causal tick of a World. World names a cut in its causal
      manifest by reference; it does not hold the states themselves.
    distinguishes_from:
      - causal-record
      - checkpoint-reference
    owners:
      - component.world-causal-manifest
    canonical_refs:
      - explanation/world/causal-manifest.md

  checkpoint-reference:
    term: "Checkpoint reference"
    definition: >
      An opaque pointer from World to one owner's checkpoint: owner, identity,
      checkpoint identifier, schema version, locator and hash. It lets World
      name a state without being able to read or judge it.
    distinguishes_from:
      - causal-cut
    owners:
      - component.world-causal-manifest
    canonical_refs:
      - explanation/world/causal-manifest.md

  owner-checkpoint-contract:
    term: "Owner checkpoint contract"
    definition: >
      A capability supplied by an owner that answers whether given checkpoint
      bytes are valid for a given identity and schema, at validation and after
      restoration. World calls it without understanding the bytes; it is
      trusted code and not a proof of honesty or completeness.
    distinguishes_from:
      - checkpoint-reference
    owners:
      - component.world-durable-runtime
    canonical_refs:
      - explanation/world/durable-runtime.md

  transduction:
    term: "Transduction"
    definition: >
      The conversion between a physical or environmental phenomenon and an
      opaque signal or effector command. It carries no interpretation: what a
      signal means belongs to the Organism. Modality is decided to define it
      (ADR-0099).
    owners:
      - concept.modality-current-state
    canonical_refs:
      - explanation/modality/current-state.md

  solver-candidate:
    term: "Solver candidate"
    definition: >
      A numerical result proposed by a physical solver for one correlated
      step. It has no authority: it becomes owner state only when the owning
      domain validates and adopts it, and it is distinct from the state that
      adoption produces.
    distinguishes_from:
      - checkpoint-reference
    owners:
      - component.embodiment-physical-state
    canonical_refs:
      - explanation/embodiment/physical-state.md

  effector:
    term: "Effector"
    definition: >
      A place on a body's morphology where something physical can be
      commanded, with a stable identifier and a declared quantity, unit, range
      and neutral value. Distinct from an actuator, which is the opaque
      identifier a motor command addresses; an actuator surface associates the
      two explicitly.
    owners:
      - mechanism.embodiment-actuation-projection
    canonical_refs:
      - explanation/embodiment/actuation-projection.md

  intervention-identity:
    term: "Intervention identity"
    definition: >
      The caller-supplied identifier of one act of intervening from outside
      the simulated life. Lab files its evidence under it. It is not the
      identity of a run and not the identifier of the World transition that
      commits the act.
    distinguishes_from:
      - run-identity
    owners:
      - component.lab-operator-material-transfer
    canonical_refs:
      - explanation/lab/operator-material-transfer.md

  run-identity:
    term: "Run identity"
    definition: >
      The identifier of a scientific execution an intervention is declared to
      have taken place in. Required when the intervention is declared
      experimental and refused when it is declared non-experimental. The code
      checks that it is present, not that the run exists.
    distinguishes_from:
      - intervention-identity
    owners:
      - component.lab-operator-material-transfer
    canonical_refs:
      - explanation/lab/operator-material-transfer.md

  evidence-checkpoint:
    term: "Evidence checkpoint"
    definition: >
      The record Lab writes for one intervention: who asked, what was asked,
      and the quantities requested, offered, accepted and debited. It takes
      part in one World causal cut as a participant of that step only. It is
      Lab's provenance of an act, not a state of any owner and not a
      scientific result.
    distinguishes_from:
      - checkpoint-reference
    owners:
      - component.lab-operator-material-transfer
    canonical_refs:
      - explanation/lab/operator-material-transfer.md
