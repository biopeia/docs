schema_version: 1

# Conceptual distinctions that recur across the documentation.
terms:

  causal-record:
    term: "Causal record"
    definition: >
      An immutable envelope for one World-scoped causal event: its identifier,
      World, causal tick, opaque type, optional actor, JSON-compatible payload
      and the identifiers of related records. The journal that holds it does
      not interpret its type or payload.
    distinguishes_from:
      - causal-tick
    owners:
      - component.world-causal-journal
    canonical_refs:
      - explanation/world/causal-journal.md

  causal-tick:
    term: "Causal tick"
    definition: >
      The count of transitions a World has committed. It is the only clock the
      causal journal carries. It is not host wall-clock time, and one tick may
      in principle carry more than one causal record.
    distinguishes_from:
      - causal-record
    owners:
      - component.world-causal-journal
    canonical_refs:
      - explanation/world/causal-journal.md

  causal-cut:
    term: "Causal cut"
    definition: >
      The set of owner states and the journal position that belong together at
      one committed causal tick of a World. World names a cut in its causal
      manifest by reference; it does not hold the states themselves.
    distinguishes_from:
      - causal-record
      - checkpoint-reference
    owners:
      - component.world-causal-manifest
    canonical_refs:
      - explanation/world/causal-manifest.md

  checkpoint-reference:
    term: "Checkpoint reference"
    definition: >
      An opaque pointer from World to one owner's checkpoint: owner, identity,
      checkpoint identifier, schema version, locator and hash. It lets World
      name a state without being able to read or judge it.
    distinguishes_from:
      - causal-cut
    owners:
      - component.world-causal-manifest
    canonical_refs:
      - explanation/world/causal-manifest.md

  owner-checkpoint-contract:
    term: "Owner checkpoint contract"
    definition: >
      A capability supplied by an owner that answers whether given checkpoint
      bytes are valid for a given identity and schema, at validation and after
      restoration. World calls it without understanding the bytes; it is
      trusted code and not a proof of honesty or completeness.
    distinguishes_from:
      - checkpoint-reference
    owners:
      - component.world-durable-runtime
    canonical_refs:
      - explanation/world/durable-runtime.md

  transduction:
    term: "Transduction"
    definition: >
      The conversion between a physical or environmental phenomenon and an
      opaque signal or effector command. It carries no interpretation: what a
      signal means belongs to the Organism. Modality is decided to define it
      (ADR-0099).
    owners:
      - concept.modality-current-state
    canonical_refs:
      - explanation/modality/current-state.md

  solver-candidate:
    term: "Solver candidate"
    definition: >
      A numerical result proposed by a physical solver for one correlated
      step. It has no authority: it becomes owner state only when the owning
      domain validates and adopts it, and it is distinct from the state that
      adoption produces.
    distinguishes_from:
      - checkpoint-reference
    owners:
      - component.embodiment-physical-state
    canonical_refs:
      - explanation/embodiment/physical-state.md

  effector:
    term: "Effector"
    definition: >
      A place on a body's morphology where something physical can be
      commanded, with a stable identifier and a declared quantity, unit, range
      and neutral value. Distinct from an actuator, which is the opaque
      identifier a motor command addresses; an actuator surface associates the
      two explicitly.
    owners:
      - mechanism.embodiment-actuation-projection
    canonical_refs:
      - explanation/embodiment/actuation-projection.md

  intervention-identity:
    term: "Intervention identity"
    definition: >
      The caller-supplied identifier of one act of intervening from outside
      the simulated life. Lab files its evidence under it. It is not the
      identity of a run and not the identifier of the World transition that
      commits the act.
    distinguishes_from:
      - run-identity
    owners:
      - component.lab-operator-material-transfer
    canonical_refs:
      - explanation/lab/operator-material-transfer.md

  run-identity:
    term: "Run identity"
    definition: >
      The identifier of a scientific execution an intervention is declared to
      have taken place in. Required when the intervention is declared
      experimental and refused when it is declared non-experimental. The code
      checks that it is present, not that the run exists.
    distinguishes_from:
      - intervention-identity
    owners:
      - component.lab-operator-material-transfer
    canonical_refs:
      - explanation/lab/operator-material-transfer.md

  evidence-checkpoint:
    term: "Evidence checkpoint"
    definition: >
      The record Lab writes for one intervention: who asked, what was asked,
      and the quantities requested, offered, accepted and debited. It takes
      part in one World causal cut as a participant of that step only. It is
      Lab's provenance of an act, not a state of any owner and not a
      scientific result.
    distinguishes_from:
      - checkpoint-reference
    owners:
      - component.lab-operator-material-transfer
    canonical_refs:
      - explanation/lab/operator-material-transfer.md

  semantic-claim:
    term: "Semantic claim"
    definition: >
      One assertion under one semantic family, hence one authority, about one
      subject and with one epistemic kind. Its value is opaque to the common
      model. A claim says what is asserted; it does not say who produced the
      representation or when it held.
    distinguishes_from:
      - semantic-observation
      - causal-record
    owners:
      - component.observation-semantic-claim-model
    canonical_refs:
      - explanation/observation/semantic-claim-model.md

  semantic-observation:
    term: "Semantic observation"
    definition: >
      A semantic claim together with the circumstances of its making:
      acquisition, asserter, producer, domain time, context time, identity
      links, lineage, conditions and optional run context. Its authority is
      that of its claim. It is a value, not a delivery or a record of
      evidence.
    distinguishes_from:
      - semantic-claim
    owners:
      - component.observation-semantic-claim-model
    canonical_refs:
      - explanation/observation/semantic-claim-model.md

  delivery-sequence:
    term: "Delivery sequence"
    definition: >
      The count of publications to one observation plane instance, assigned
      in the order the plane received them and shared by all families. It
      orders delivery. It is not domain time, is not a causal tick, and has
      no meaning outside the plane instance that issued it.
    distinguishes_from:
      - causal-tick
    owners:
      - component.observation-plane
    canonical_refs:
      - explanation/observation/observation-plane.md

  rebase-request:
    term: "Rebase request"
    definition: >
      The observation plane's signal to one stream that what the consumer
      holds may be incomplete and must be replaced from the current view. It
      reports a loss of delivery, never the absence of the source state.
    distinguishes_from:
      - delivery-sequence
    owners:
      - component.observation-plane
    canonical_refs:
      - explanation/observation/observation-plane.md

  organism-checkpoint-envelope:
    term: "Organism checkpoint envelope"
    definition: >
      The Organism-defined value that carries an identity, private state as
      uninterpreted bytes with their digest, and the references needed to
      restore that state. It is what a checkpoint reference of World would
      point to; it does not say how the state is assembled or restored.
    distinguishes_from:
      - checkpoint-reference
      - dependency-closure
    owners:
      - component.organism-identity-checkpoint
    canonical_refs:
      - explanation/organism/identity-and-checkpoint.md

  dependency-closure:
    term: "Dependency closure"
    definition: >
      The set of external contents a checkpoint needs in order to be restored.
      The envelope can verify the dependencies it declares, each by locator
      and digest; it cannot tell whether the declared set is the required one.
    distinguishes_from:
      - organism-checkpoint-envelope
    owners:
      - component.organism-identity-checkpoint
    canonical_refs:
      - explanation/organism/identity-and-checkpoint.md

  action-commitment:
    term: "Action commitment"
    definition: >
      The mutable Organism record under which motor commands may be issued: it
      names a proposal, a controller and an actuator surface fingerprint, and
      is active until ended once. It is a record, not an enforcement: the code
      does not require that it result from an arbitration.
    distinguishes_from:
      - motor-command
    owners:
      - mechanism.organism-action-path
    canonical_refs:
      - explanation/organism/action-path.md

  motor-command:
    term: "Motor command"
    definition: >
      An immutable Organism value naming activations for some channels of one
      actuator surface, with the commitment, controller and tick it was issued
      under. It lists only the channels commanded. It is not an execution and
      not the effector command of Embodiment.
    distinguishes_from:
      - action-commitment
    owners:
      - mechanism.organism-action-path
    canonical_refs:
      - explanation/organism/action-path.md

  body-specification:
    term: "Body specification"
    definition: >
      An engine-neutral, immutable record of what an articulated body is made
      of: segments, hinge joints, topology and some further properties. It has
      no identity of its own, names no body, episode or revision, and holds no
      state. A textual description is generated from part of it.
    distinguishes_from:
      - active-morphology-descriptor
    owners:
      - component.embodiment-articulated-body
    canonical_refs:
      - explanation/embodiment/articulated-body.md

  active-morphology-descriptor:
    term: "Active morphology descriptor"
    definition: >
      A value that binds one generated body description, by its SHA-256, and
      the joint ranges of one body specification to a body, an embodiment
      episode and a morphology revision. Joint state and its checkpoint are
      verified against it. It does not authenticate its own origin and it is
      not the specification.
    distinguishes_from:
      - body-specification
    owners:
      - component.embodiment-articulated-body
    canonical_refs:
      - explanation/embodiment/articulated-body.md

  physical-duration:
    term: "Physical duration"
    definition: >
      A non-negative, finite number of seconds of time elapsed in the physical
      substrate. It is supplied, not measured. It is not the causal tick, which
      counts committed transitions, and not host wall-clock time.
    distinguishes_from:
      - causal-tick
    owners:
      - mechanism.embodiment-physical-projection
    canonical_refs:
      - explanation/embodiment/physical-projection.md
