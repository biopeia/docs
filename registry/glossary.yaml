schema_version: 1

# Conceptual distinctions that recur across the documentation.
terms:

  causal-record:
    term: "Causal record"
    definition: >
      An immutable envelope for one World-scoped causal event: its identifier,
      World, causal tick, opaque type, optional actor, JSON-compatible payload
      and the identifiers of related records. The journal that holds it does
      not interpret its type or payload.
    distinguishes_from:
      - causal-tick
    owners:
      - component.world-causal-journal
    canonical_refs:
      - explanation/world/causal-journal.md

  causal-tick:
    term: "Causal tick"
    definition: >
      The count of transitions a World has committed. It is the only clock the
      causal journal carries. It is not host wall-clock time, and one tick may
      in principle carry more than one causal record.
    distinguishes_from:
      - causal-record
    owners:
      - component.world-causal-journal
    canonical_refs:
      - explanation/world/causal-journal.md

  causal-cut:
    term: "Causal cut"
    definition: >
      The set of owner states and the journal position that belong together at
      one committed causal tick of a World. World names a cut in its causal
      manifest by reference; it does not hold the states themselves.
    distinguishes_from:
      - causal-record
      - checkpoint-reference
    owners:
      - component.world-causal-manifest
    canonical_refs:
      - explanation/world/causal-manifest.md

  checkpoint-reference:
    term: "Checkpoint reference"
    definition: >
      An opaque pointer from World to one owner's checkpoint: owner, identity,
      checkpoint identifier, schema version, locator and hash. It lets World
      name a state without being able to read or judge it.
    distinguishes_from:
      - causal-cut
    owners:
      - component.world-causal-manifest
    canonical_refs:
      - explanation/world/causal-manifest.md

  owner-checkpoint-contract:
    term: "Owner checkpoint contract"
    definition: >
      A capability supplied by an owner that answers whether given checkpoint
      bytes are valid for a given identity and schema, at validation and after
      restoration. World calls it without understanding the bytes; it is
      trusted code and not a proof of honesty or completeness.
    distinguishes_from:
      - checkpoint-reference
    owners:
      - component.world-durable-runtime
    canonical_refs:
      - explanation/world/durable-runtime.md

  organism-checkpoint-envelope:
    term: "Organism checkpoint envelope"
    definition: >
      The Organism-defined value that carries an identity, private state as
      uninterpreted bytes with their digest, and the references needed to
      restore that state. It is what a checkpoint reference of World would
      point to; it does not say how the state is assembled or restored.
    distinguishes_from:
      - checkpoint-reference
      - dependency-closure
    owners:
      - component.organism-identity-checkpoint
    canonical_refs:
      - explanation/organism/identity-and-checkpoint.md

  dependency-closure:
    term: "Dependency closure"
    definition: >
      The set of external contents a checkpoint needs in order to be restored.
      The envelope can verify the dependencies it declares, each by locator
      and digest; it cannot tell whether the declared set is the required one.
    distinguishes_from:
      - organism-checkpoint-envelope
    owners:
      - component.organism-identity-checkpoint
    canonical_refs:
      - explanation/organism/identity-and-checkpoint.md

  action-commitment:
    term: "Action commitment"
    definition: >
      The mutable Organism record under which motor commands may be issued: it
      names a proposal, a controller and an actuator surface fingerprint, and
      is active until ended once. It is a record, not an enforcement: the code
      does not require that it result from an arbitration.
    distinguishes_from:
      - motor-command
    owners:
      - mechanism.organism-action-path
    canonical_refs:
      - explanation/organism/action-path.md

  motor-command:
    term: "Motor command"
    definition: >
      An immutable Organism value naming activations for some channels of one
      actuator surface, with the commitment, controller and tick it was issued
      under. It lists only the channels commanded. It is not an execution and
      not the effector command of Embodiment.
    distinguishes_from:
      - action-commitment
    owners:
      - mechanism.organism-action-path
    canonical_refs:
      - explanation/organism/action-path.md
