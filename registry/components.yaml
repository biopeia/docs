schema_version: 1

# Authority, state ownership and lifecycle behaviour of each component unit.
components:

  WLD-JRN:
    coverage_unit: component.world-causal-journal
    name: "World causal journal"
    authority:
      owns: "the in-memory append order, read-only record envelopes and prefix digests of committed World causal records"
      may_decide:
        - "whether a record can be encoded and therefore appended"
        - "whether a staged batch is published as a whole or not at all"
      must_not:
        - "interpret record types, payloads or the related-record identifiers it carries"
        - "claim durable storage, atomic publication or recovery"
        - "decide whether a causal tick commits"
    state:
      owner: world
      family: causal_history
    causal_state:
      durable: false
      in_causal_cut: true
      failed_transition_residue: "staged records remain staged after a failed batch commit; nothing durable. Its records are named by a cut through the journal boundary only when a durable runtime drives it"
    inputs:
      - "causal records built by a World runtime"
    outputs:
      - "committed records in commit order"
      - "prefix digests"
      - "plain-data snapshots"
    consumers:
      - "World runtimes and the journal snapshot store (not currently registered as units)"
      - "WLD-MAN, the registered World causal manifest unit"

  WLD-MAN:
    coverage_unit: component.world-causal-manifest
    name: "World causal manifest"
    authority:
      owns: "the durable record of a World causal cut: its tick, rosters, opaque owner checkpoint references, journal boundary and commit or recovery status"
      may_decide:
        - "whether a manifest is well formed"
        - "whether a proposed cut matches the transition that was opened"
        - "whether ordinary execution is refused because a transition is pending"
      must_not:
        - "decode, write or judge the owner state its references point to"
        - "restore owner state during recovery"
        - "claim to be a transaction across owners, a multi-writer protocol or a security boundary"
    state:
      owner: world
      family: causal_history
    causal_state:
      durable: true
      in_causal_cut: true
      failed_transition_residue: "a preparing or recovery-required record naming the failed transition, its proposed rosters and the failure; after recovery, an immutable receipt"
    inputs:
      - "owner checkpoint references and rosters proposed by the durable World runtime"
      - "a dependency verifier supplied by the caller"
    outputs:
      - "the committed manifest of each cut"
      - "recovery receipts"
    consumers:
      - "the durable World runtime (not yet registered as a unit)"

  WLD-SNP:
    coverage_unit: component.world-journal-snapshot-store
    name: "World journal snapshot store"
    authority:
      owns: "the immutable on-disk snapshots of the World causal journal and the checkpoint references to them"
      may_decide:
        - "whether a reference names an intact journal snapshot"
        - "whether an existing snapshot file is identical to a candidate"
      must_not:
        - "decide whether a causal tick commits"
        - "interpret the records it stores"
        - "remove or rewrite a snapshot"
    state:
      owner: world
      family: causal_history
    causal_state:
      durable: true
      in_causal_cut: true
      failed_transition_residue: "a snapshot file for the failed tick, referenced by no committed cut"
    inputs:
      - "a journal and the causal tick it is being saved for"
    outputs:
      - "one immutable snapshot file per request"
      - "a checkpoint reference under the owner name world-journal"
    consumers:
      - component.world-durable-runtime

  WLD-DRT:
    coverage_unit: component.world-durable-runtime
    name: "Durable World runtime"
    authority:
      owns: "the coordination of a World causal transition from one committed cut to the next, and the in-process refusal to continue after a failure"
      may_decide:
        - "whether a transition may open, given the durable manifest and the requested roster changes"
        - "whether the references returned by the owners name the proposed participants and intact, owner-validated checkpoints"
        - "whether the cut is published"
      must_not:
        - "hold, read or interpret the state of an Organism, an Embodiment or an Environment"
        - "restore owner state itself during recovery"
        - "claim crash consistency, rollback across owners or a multi-writer protocol"
    state:
      owner: world
      family: ephemeral
    causal_state:
      durable: false
      in_causal_cut: false
      failed_transition_residue: "an in-memory latch that refuses further ticks; owner checkpoints written by the callback, referenced by no committed cut"
    inputs:
      - "a genesis specification"
      - "a callback that persists owner state and returns checkpoint references"
      - "owner checkpoint contracts, a dependency verifier and a restorer supplied by the caller"
    outputs:
      - "one causal record per committed tick"
      - "the committed manifest of each cut, through the manifest store"
    consumers:
      - "compositions that drive a World, such as the integration tests and Lab (not registered as units)"

  WLD-RTM:
    coverage_unit: component.world-in-memory-runtime
    name: "In-memory World runtime"
    authority:
      owns: "an in-memory World identity, one presence, a tick counter and its causal journal, and the in-process refusal to continue after a failed transition"
      may_decide:
        - "whether a tick may start"
        - "whether a returned payload is publishable"
      must_not:
        - "interpret the transition it runs or roll back what it changed"
        - "claim durable state or recovery"
    state:
      owner: world
      family: ephemeral
    causal_state:
      durable: false
      in_causal_cut: false
      failed_transition_residue: "an in-memory latch that refuses further ticks; whatever the opaque transition changed before failing is not rolled back"
    inputs:
      - "a transition callback supplied by the caller"
    outputs:
      - "one causal record per committed tick"
    consumers:
      - "bounded compositions such as the first causal tick integration test (not registered as units)"

  ENV-RES:
    coverage_unit: component.environment-finite-resource
    name: "Finite resource"
    authority:
      owns: "the objective quantity remaining of one finite environmental resource, its place, its scalar field and its stable identity"
      may_decide:
        - "how much it offers in one call and how much of a reported acceptance it debits"
        - "whether checkpoint bytes are a valid state of this resource under its schema"
      must_not:
        - "determine contact, cause an organism action or assign meaning to the resource"
        - "regenerate"
        - "claim physical equivalence to an endogenous mechanism"
    state:
      owner: environment
      family: environmental_state
    inputs:
      - "a point, to evaluate the field"
      - "the amount a consumer reports having accepted"
    outputs:
      - "the scalar field at a point"
      - "the quantity offered and the quantity actually removed"
      - "a checkpoint with its identity"
    consumers:
      - "Lab's operator material transfer and the durable World runtime, through the owner validation methods (not registered as units)"

  ENV-SCN:
    coverage_unit: component.environment-static-scene
    name: "Static scene and its owner"
    authority:
      owns: "an immutable static physical scene (frame, gravity, ground planes, spheres) and the record of the last physical step Environment accepted for it"
      may_decide:
        - "whether a scene is well formed"
        - "whether a candidate step is the next one and leaves the scene unchanged"
        - "whether checkpoint bytes are a valid state of this owner under its schema"
      must_not:
        - "depend on a solver or let a solver own the scene"
        - "adopt a changed scene"
        - "mint the authority of a physical step"
    state:
      owner: environment
      family: environmental_state
    inputs:
      - "a candidate scene with a correlation, and the correlation to expect"
    outputs:
      - "a canonical projection of the scene"
      - "a checkpoint holding the scene and the last accepted correlation"
    consumers:
      - mechanism.physical-causal-step

  EMB-PHY:
    coverage_unit: component.embodiment-physical-state
    name: "Body physical state and adoption of a solver candidate"
    authority:
      owns: "the free-root pose and velocities of one body in one embodiment episode at one World causal tick, and the correlation of the last physical step accepted for it"
      may_decide:
        - "whether a solver candidate matches the expected correlation and this state's World, tick, body, episode, morphology revision and frames"
        - "whether checkpoint bytes decode to a consistent state under its schema"
      must_not:
        - "execute a solver or let a solver change the state"
        - "commit a World cut or claim a durable checkpoint reference"
        - "mint the authority of a physical step"
    state:
      owner: embodiment
      family: embodiment_local
    # birth, checkpoint and restart are read from the code. The code has no
    # path for re-embodiment or reproduction: those two values record the
    # intent of ADR-0094, not observed behaviour.
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: reset
      reproduction: not_inherited
    inputs:
      - "a solver candidate with its correlation, and the correlation to expect"
    outputs:
      - "a new state one causal tick later"
      - "deterministic checkpoint bytes and their digest"
    consumers:
      - mechanism.physical-causal-step

  EMB-SOM:
    coverage_unit: component.embodiment-somatic-state
    name: "Somatic state, metabolic ledger and body checkpoint"
    authority:
      owns: "one body's energy reserve and maximum, structural integrity and per-structure records, vital state, age, stored temperature, fatigue, growth and senescence values, and the per-kind metabolic accounts"
      may_decide:
        - "how much of a charge or an intake the body's energy pool absorbs"
        - "the pressure for an energy ratio and the vital state for a pressure"
        - "whether a material transfer is addressed to this body and how much of it is accepted"
        - "whether checkpoint bytes are a valid state of this body under its schema"
      must_not:
        - "leave the dead state"
        - "create physical energy by refilling accounting channels"
        - "assign Organism identity or World commit authority to Embodiment"
        - "obtain or authorise a material transfer"
    state:
      owner: embodiment
      family: embodiment_local
    # birth, checkpoint and restart are read from the code; the checkpoint
    # loses the physiology configuration and the per-tick spent amounts
    # (F-0025). The code has no path for re-embodiment or reproduction: those
    # two values record the intent of ADR-0094, not observed behaviour.
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: reset
      reproduction: not_inherited
    inputs:
      - "charges by kind, intakes, material transfers addressed to the body"
      - "a caller-supplied tick and resting flag when the controller is advanced"
    outputs:
      - "metabolic and physiology snapshots"
      - "a read-only export of the record for observation"
      - "a checkpoint of body and ledger under body and episode identifiers"
    consumers:
      - "Lab's operator material transfer and World's durable checkpoint integration tests (not registered as units)"
