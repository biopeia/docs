schema_version: 1

# Authority, state ownership and lifecycle behaviour of each component unit.
components:

  WLD-JRN:
    coverage_unit: component.world-causal-journal
    name: "World causal journal"
    authority:
      owns: "the in-memory append order, read-only record envelopes and prefix digests of committed World causal records"
      may_decide:
        - "whether a record can be encoded and therefore appended"
        - "whether a staged batch is published as a whole or not at all"
      must_not:
        - "interpret record types, payloads or the related-record identifiers it carries"
        - "claim durable storage, atomic publication or recovery"
        - "decide whether a causal tick commits"
    state:
      owner: world
      family: causal_history
    causal_state:
      durable: false
      in_causal_cut: true
      failed_transition_residue: "staged records remain staged after a failed batch commit; nothing durable. Its records are named by a cut through the journal boundary only when a durable runtime drives it"
    inputs:
      - "causal records built by a World runtime"
    outputs:
      - "committed records in commit order"
      - "prefix digests"
      - "plain-data snapshots"
    consumers:
      - "World runtimes and the journal snapshot store (not currently registered as units)"
      - "WLD-MAN, the registered World causal manifest unit"

  WLD-MAN:
    coverage_unit: component.world-causal-manifest
    name: "World causal manifest"
    authority:
      owns: "the durable record of a World causal cut: its tick, rosters, opaque owner checkpoint references, journal boundary and commit or recovery status"
      may_decide:
        - "whether a manifest is well formed"
        - "whether a proposed cut matches the transition that was opened"
        - "whether ordinary execution is refused because a transition is pending"
      must_not:
        - "decode, write or judge the owner state its references point to"
        - "restore owner state during recovery"
        - "claim to be a transaction across owners, a multi-writer protocol or a security boundary"
    state:
      owner: world
      family: causal_history
    causal_state:
      durable: true
      in_causal_cut: true
      failed_transition_residue: "a preparing or recovery-required record naming the failed transition, its proposed rosters and the failure; after recovery, an immutable receipt"
    inputs:
      - "owner checkpoint references and rosters proposed by the durable World runtime"
      - "a dependency verifier supplied by the caller"
    outputs:
      - "the committed manifest of each cut"
      - "recovery receipts"
    consumers:
      - "the durable World runtime (not yet registered as a unit)"

  WLD-SNP:
    coverage_unit: component.world-journal-snapshot-store
    name: "World journal snapshot store"
    authority:
      owns: "the immutable on-disk snapshots of the World causal journal and the checkpoint references to them"
      may_decide:
        - "whether a reference names an intact journal snapshot"
        - "whether an existing snapshot file is identical to a candidate"
      must_not:
        - "decide whether a causal tick commits"
        - "interpret the records it stores"
        - "remove or rewrite a snapshot"
    state:
      owner: world
      family: causal_history
    causal_state:
      durable: true
      in_causal_cut: true
      failed_transition_residue: "a snapshot file for the failed tick, referenced by no committed cut"
    inputs:
      - "a journal and the causal tick it is being saved for"
    outputs:
      - "one immutable snapshot file per request"
      - "a checkpoint reference under the owner name world-journal"
    consumers:
      - component.world-durable-runtime

  WLD-DRT:
    coverage_unit: component.world-durable-runtime
    name: "Durable World runtime"
    authority:
      owns: "the coordination of a World causal transition from one committed cut to the next, and the in-process refusal to continue after a failure"
      may_decide:
        - "whether a transition may open, given the durable manifest and the requested roster changes"
        - "whether the references returned by the owners name the proposed participants and intact, owner-validated checkpoints"
        - "whether the cut is published"
      must_not:
        - "hold, read or interpret the state of an Organism, an Embodiment or an Environment"
        - "restore owner state itself during recovery"
        - "claim crash consistency, rollback across owners or a multi-writer protocol"
    state:
      owner: world
      family: ephemeral
    causal_state:
      durable: false
      in_causal_cut: false
      failed_transition_residue: "an in-memory latch that refuses further ticks; owner checkpoints written by the callback, referenced by no committed cut"
    inputs:
      - "a genesis specification"
      - "a callback that persists owner state and returns checkpoint references"
      - "owner checkpoint contracts, a dependency verifier and a restorer supplied by the caller"
    outputs:
      - "one causal record per committed tick"
      - "the committed manifest of each cut, through the manifest store"
    consumers:
      - "compositions that drive a World, such as the integration tests and Lab (not registered as units)"

  WLD-RTM:
    coverage_unit: component.world-in-memory-runtime
    name: "In-memory World runtime"
    authority:
      owns: "an in-memory World identity, one presence, a tick counter and its causal journal, and the in-process refusal to continue after a failed transition"
      may_decide:
        - "whether a tick may start"
        - "whether a returned payload is publishable"
      must_not:
        - "interpret the transition it runs or roll back what it changed"
        - "claim durable state or recovery"
    state:
      owner: world
      family: ephemeral
    causal_state:
      durable: false
      in_causal_cut: false
      failed_transition_residue: "an in-memory latch that refuses further ticks; whatever the opaque transition changed before failing is not rolled back"
    inputs:
      - "a transition callback supplied by the caller"
    outputs:
      - "one causal record per committed tick"
    consumers:
      - "bounded compositions such as the first causal tick integration test (not registered as units)"

  ENV-RES:
    coverage_unit: component.environment-finite-resource
    name: "Finite resource"
    authority:
      owns: "the objective quantity remaining of one finite environmental resource, its place, its scalar field and its stable identity"
      may_decide:
        - "how much it offers in one call and how much of a reported acceptance it debits"
        - "whether checkpoint bytes are a valid state of this resource under its schema"
      must_not:
        - "determine contact, cause an organism action or assign meaning to the resource"
        - "regenerate"
        - "claim physical equivalence to an endogenous mechanism"
    state:
      owner: environment
      family: environmental_state
    inputs:
      - "a point, to evaluate the field"
      - "the amount a consumer reports having accepted"
    outputs:
      - "the scalar field at a point"
      - "the quantity offered and the quantity actually removed"
      - "a checkpoint with its identity"
    consumers:
      - "Lab's operator material transfer and the durable World runtime, through the owner validation methods (not registered as units)"

  ENV-SCN:
    coverage_unit: component.environment-static-scene
    name: "Static scene and its owner"
    authority:
      owns: "an immutable static physical scene (frame, gravity, ground planes, spheres) and the record of the last physical step Environment accepted for it"
      may_decide:
        - "whether a scene is well formed"
        - "whether a candidate step is the next one and leaves the scene unchanged"
        - "whether checkpoint bytes are a valid state of this owner under its schema"
      must_not:
        - "depend on a solver or let a solver own the scene"
        - "adopt a changed scene"
        - "mint the authority of a physical step"
    state:
      owner: environment
      family: environmental_state
    inputs:
      - "a candidate scene with a correlation, and the correlation to expect"
    outputs:
      - "a canonical projection of the scene"
      - "a checkpoint holding the scene and the last accepted correlation"
    consumers:
      - mechanism.physical-causal-step

  ENV-GEN:
    coverage_unit: component.environment-procedural-genesis
    name: "Procedural genesis of a scene"
    authority:
      owns: "one identified, versioned generator that turns a seed and an explicit configuration into a static scene with recorded provenance"
      may_decide:
        - "whether a specification names the supported generator and is well formed"
        - "where each sphere is placed and its radius, from a digest of the specification"
      must_not:
        - "read host time, process state or a global random source"
        - "guarantee non-overlap, terrain quality, ecological meaning or scientific suitability"
        - "attach labels or meaning to what it generates"
    state:
      owner: implementation-local
      family: ephemeral
    inputs:
      - "a genesis specification: seed, generator identity and revision, configuration"
    outputs:
      - "a static scene carrying its genesis provenance"
    consumers:
      - component.environment-static-scene
      - mechanism.physical-causal-step

  ENV-GEO:
    coverage_unit: component.environment-resource-geometry
    name: "Physical projection of resource geometry"
    authority:
      owns: "the realisation of a resource's relative centre and radius as a sphere in metres, in a frame and at a scale the caller declares"
      may_decide:
        - "whether the frame, scale and geometry are well formed"
      must_not:
        - "infer calibration or supply a default frame or scale"
        - "transform coordinates to another frame"
        - "treat the scalar field, the quantity or the transfer bound as collider data"
        - "change the resource"
    state:
      owner: implementation-local
      family: ephemeral
    inputs:
      - "a finite resource, a frame and a scale in metres per resource unit"
    outputs:
      - "a sphere in metres that records the scale used"
    consumers:
      - "none found in the source of any repository at the revision reviewed"

  EMB-PHY:
    coverage_unit: component.embodiment-physical-state
    name: "Body physical state and adoption of a solver candidate"
    authority:
      owns: "the free-root pose and velocities of one body in one embodiment episode at one World causal tick, and the correlation of the last physical step accepted for it"
      may_decide:
        - "whether a solver candidate matches the expected correlation and this state's World, tick, body, episode, morphology revision and frames"
        - "whether checkpoint bytes decode to a consistent state under its schema"
      must_not:
        - "execute a solver or let a solver change the state"
        - "commit a World cut or claim a durable checkpoint reference"
        - "mint the authority of a physical step"
    state:
      owner: embodiment
      family: embodiment_local
    # birth, checkpoint and restart are read from the code. The code has no
    # path for re-embodiment or reproduction: those two values record the
    # intent of ADR-0094, not observed behaviour.
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: reset
      reproduction: not_inherited
    inputs:
      - "a solver candidate with its correlation, and the correlation to expect"
    outputs:
      - "a new state one causal tick later"
      - "deterministic checkpoint bytes and their digest"
    consumers:
      - mechanism.physical-causal-step

  EMB-SOM:
    coverage_unit: component.embodiment-somatic-state
    name: "Somatic state, metabolic ledger and body checkpoint"
    authority:
      owns: "one body's energy reserve and maximum, structural integrity and per-structure records, vital state, age, stored temperature, fatigue, growth and senescence values, and the per-kind metabolic accounts"
      may_decide:
        - "how much of a charge or an intake the body's energy pool absorbs"
        - "the pressure for an energy ratio and the vital state for a pressure"
        - "whether a material transfer is addressed to this body and how much of it is accepted"
        - "whether checkpoint bytes are a valid state of this body under its schema"
      must_not:
        - "leave the dead state"
        - "create physical energy by refilling accounting channels"
        - "assign Organism identity or World commit authority to Embodiment"
        - "obtain or authorise a material transfer"
    state:
      owner: embodiment
      family: embodiment_local
    # birth, checkpoint and restart are read from the code; the checkpoint
    # loses the physiology configuration and the per-tick spent amounts
    # (F-0025). The code has no path for re-embodiment or reproduction: those
    # two values record the intent of ADR-0094, not observed behaviour.
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: reset
      reproduction: not_inherited
    inputs:
      - "charges by kind, intakes, material transfers addressed to the body"
      - "a caller-supplied tick and resting flag when the controller is advanced"
    outputs:
      - "metabolic and physiology snapshots"
      - "a read-only export of the record for observation"
      - "a checkpoint of body and ledger under body and episode identifiers"
    consumers:
      - "Lab's operator material transfer and World's durable checkpoint integration tests (not registered as units)"

  LAB-OMT:
    coverage_unit: component.lab-operator-material-transfer
    name: "Operator material transfer"
    authority:
      owns: "the intervention request as declared by the caller, the order in which Environment, Embodiment and World are asked, and the intervention evidence checkpoint with the files of its store"
      may_decide:
        - "whether a request is well formed and agrees with the identities the owners carry"
        - "how much to ask the resource for, within the bound the caller declared"
        - "whether bytes are a valid evidence checkpoint for an intervention identity"
      must_not:
        - "decide how much the resource offers or is debited, or how much the body accepts"
        - "change the owners' objects in place or adopt a state World has not committed"
        - "treat the operator identifier as authentication or authorisation"
        - "claim equivalence to an endogenous physical mechanism, or present a transfer as a scientific result"
    state:
      owner: lab
      family: evidence_record
    inputs:
      - "a caller-declared intervention request and a requested quantity"
      - "Environment's identified resource and Embodiment's checkpoint object, matching the World's committed cut"
      - "a durable World runtime whose registered owners are exactly those two"
    outputs:
      - "one committed World tick with new Environment and Embodiment checkpoints"
      - "an evidence checkpoint filed under the intervention identity"
      - "three events from Observation's projection, returned to the caller"
    consumers:
      - "none registered; called by its own integration tests only"

  LAB-STU:
    coverage_unit: component.lab-study-utilities
    name: "Study utilities"
    authority:
      owns: "nothing persistent; pure computations over seed lists, lists of scalar measurements, an event stream of one historical shape and a configuration dictionary"
      may_decide:
        - "whether seed lists are unique, disjoint or equal in order"
        - "which values count as missing in a summary"
      must_not:
        - "run experiments, own simulated life or carry scientific artifacts"
        - "be read as a test of significance or as evidence of an effect"
        - "be taken for a digest of a Biopeia World"
    state:
      owner: implementation-local
      family: ephemeral
    inputs:
      - "lists of seeds, lists of numbers with missing values, events, a dictionary"
    outputs:
      - "an error or nothing; means, differences and an aggregate; SHA-256 text"
    consumers:
      - "none in the Biopeia repositories"

  LAB-INT:
    coverage_unit: component.lab-body-interoception-transducer
    name: "Body interoception transducer"
    authority:
      owns: "the permutation that assigns four body-state sources to four caller-named slots"
      may_decide:
        - "whether a mapping is a permutation of the four sources"
        - "how each source is limited to the range from zero to one"
      must_not:
        - "assign labels, valence or action meaning to the values"
        - "change the body state it reads or own any physiology"
        - "claim scientific validity"
    state:
      owner: lab
      family: infrastructure
    inputs:
      - "any object exposing energy reserve, maximum energy, structural integrity, temperature and fatigue"
      - "four distinct receptor identifiers supplied by the caller"
    outputs:
      - "four values between zero and one under the caller's identifiers"
      - "a checkpoint holding only the permutation"
    consumers:
      - "none in the Biopeia repositories"

  OBS-SEM:
    coverage_unit: component.observation-semantic-claim-model
    name: "Semantic claim model"
    authority:
      owns: "the shape of a semantic claim and of an observation of it, and the few cross-field rules checked when one is built; no state and no meaning"
      may_decide:
        - "whether a value is a well-formed claim, observation, identity, time reference, lineage or condition"
        - "whether a claim under Lab authority carries the lab_derived kind"
        - "whether a primary domain-time reference names the claim's authority"
      must_not:
        - "be the authority for any claim it describes"
        - "define a semantic family, a contract, units, a wire format or a transport"
        - "be imported by the source packages of the authorities"
    state:
      owner: implementation-local
      family: ephemeral
    inputs:
      - "values supplied by whoever builds a claim"
    outputs:
      - "immutable claim and observation values whose claim payload is the caller's own object"
    consumers:
      - component.observation-plane
      - "the integration tests of the world repository, which build observations and publish them nowhere (not registered as units)"

  OBS-PLN:
    coverage_unit: component.observation-plane
    name: "Observation plane"
    authority:
      owns: "an in-memory delivery sequence, a bounded replay history, a bounded last-published view per key, and the queues of its open streams"
      may_decide:
        - "the delivery sequence of a published observation"
        - "which retained entries are evicted when a bound is exceeded"
        - "when a stream is told to rebase"
      must_not:
        - "alter, validate or interpret an observation, or decide what it means"
        - "present the delivery sequence as domain or causal time"
        - "call back into a producer or carry a command"
        - "claim durability, resumption across restarts or custody of evidence"
    state:
      owner: implementation-local
      family: ephemeral
    inputs:
      - "semantic observations handed to publish"
      - "a watermark and an optional family from a consumer opening a stream"
    outputs:
      - "messages pairing a delivery sequence with the published observation, by reference"
      - "rebase requests with a reason and the latest sequence"
      - "the retained current view"
    consumers:
      - "none found in any repository at the revisions read; only its own tests"

  OBS-PRJ:
    coverage_unit: component.observation-inherited-projection
    name: "Inherited projection"
    authority:
      owns: "a fixed list of copied key names, the grouping of them into three records, and a frame record with constant provenance labels; no state"
      may_decide:
        - "which keys of a caller's mapping are copied and how their types are coerced"
        - "that a key it does not know, or cannot convert, is omitted without an error"
      must_not:
        - "read a domain, hold state or deliver anything"
        - "be taken as a compatibility promise, a ratified contract or the meaning of the keys it copies"
        - "emit either metabolic reserve key"
    state:
      owner: implementation-local
      family: ephemeral
    inputs:
      - "one mapping per tick, assembled by the caller from values of several owners"
    outputs:
      - "three dictionaries tagged body, cognition and vitals"
      - "an observed_frame event"
    consumers:
      - "Lab's operator material transfer, in source, and one integration test of World (not registered as units)"

  ORG-IDC:
    coverage_unit: component.organism-identity-checkpoint
    name: "Organism identity and the checkpoint envelope"
    authority:
      owns: "the value that identifies one Organism and the envelope that carries its opaque private state with the references needed to restore it"
      may_decide:
        - "whether bytes are a well-formed envelope whose private state matches its recorded digest"
        - "whether every declared dependency is available and matches its digest, given a reader"
      must_not:
        - "interpret, assemble or restore the private state it carries"
        - "generate an identity from host entropy"
        - "claim to record continuations, branches or which checkpoint of an identity is canonical"
        - "claim that the declared dependencies are all the private state requires"
    state:
      owner: organism
      family: identity_longitudinal
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: not_inherited
    inputs:
      - "an identity value supplied by the caller"
      - "opaque private-state bytes and dependency references produced by an Organism-side owner"
      - "a reader from locator to bytes, for the closure check"
    outputs:
      - "a deterministic, versioned byte envelope"
      - "a decoded checkpoint, or a refusal"
    consumers:
      - "the composed cognitive runtime checkpoint in organism:src/organism/cognition/portable_checkpoint.py (not registered as a unit)"

  ORG-EOL:
    coverage_unit: component.organism-executive-outcome-ledger
    name: "Executive outcome ledger"
    authority:
      owns: "a bounded table of the last classified outcomes recorded for each pair of competence and anticipated effect, and any suppression recorded for the pair"
      may_decide:
        - "the factor, between 0.5 and 1.5, that a pair's recorded outcomes yield at lookup"
        - "whether a pair is reported as suppressed, and when a differing revision state lifts it"
        - "which pair is dropped when the table is over capacity"
      must_not:
        - "observe outcomes itself or classify anything it is not told"
        - "write causal evidence, controllability, agency or competence evidence"
        - "act as a reward or select an action"
    state:
      owner: organism
      family: adaptive_longitudinal
    lifecycle:
      birth: empty
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: not_inherited
    inputs:
      - "classified outcome samples supplied by a caller"
      - "a description of binding and revision state, for suppression"
    outputs:
      - "a modulation: factor, suppressed flag and whether history existed"
      - "an exported plain-data state and usage counters"
    consumers:
      - "the history callback of admission in mechanism.organism-action-path; no code builds that callback at the reviewed revision"

  EMB-ART:
    coverage_unit: component.embodiment-articulated-body
    name: "Articulated body specification, active morphology and joint state"
    authority:
      owns: "the description of one body's segments, hinge joints and topology, its binding to a body, an embodiment episode and a morphology revision, and the position and velocity of every joint of that body at one World causal tick"
      may_decide:
        - "whether a solver candidate names exactly the active joints and keeps each within its declared position range and velocity limit"
        - "whether checkpoint bytes decode to a state consistent with the active morphology descriptor supplied to it"
      must_not:
        - "execute a solver or let a solver change the state"
        - "coordinate or commit a World causal cut"
        - "treat the position of a joint in a collection as its identity"
        - "authenticate the origin of a morphology descriptor"
    state:
      owner: embodiment
      family: embodiment_local
    # birth, checkpoint and restart are read from the code; restart also needs
    # the caller to supply the active descriptor again, which no checkpoint
    # holds (F-0116). For re-embodiment the code has one fact, that a
    # checkpoint is refused under another episode, revision or description
    # digest, and no path that creates the successor state. The values for
    # re-embodiment and reproduction record the intent of ADR-0094 and
    # ADR-0104, not observed behaviour.
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: reset
      reproduction: not_inherited
    inputs:
      - "a body specification with the body, episode and morphology revision it is active for"
      - "a solver candidate for root and joints, and the correlation to expect"
    outputs:
      - "a textual description of the body and its SHA-256"
      - "a new articulated state one causal tick later"
      - "deterministic checkpoint bytes"
    consumers:
      - mechanism.embodiment-physical-projection
      - mechanism.physical-causal-step

  ENV-DYN:
    coverage_unit: component.environment-dynamic-state
    name: "Dynamic object state and its owner"
    authority:
      owns: "the position of one identified object in the environment, and the record of the last physical step Environment accepted for it"
      may_decide:
        - "whether a candidate is for this World, environment, revision, object and frame, and is the next step"
        - "whether checkpoint bytes are a valid state of this owner under its schema"
      must_not:
        - "define environmental laws or judge whether a proposed position is physically admissible"
        - "solve physics or claim a candidate was calibrated"
        - "mint the authority of a physical step"
    state:
      owner: environment
      family: environmental_state
    inputs:
      - "a candidate object state with a correlation, and the correlation to expect"
    outputs:
      - "the object's current state"
      - "a checkpoint holding the binding, the object state and the last accepted correlation"
    consumers:
      - "none found in the source or tests of any other repository at the revision reviewed"

  ORG-ACD:
    coverage_unit: component.organism-competence-development
    name: "Competence development engine"
    authority:
      owns: "the statistics of four-step activation sequences observed for one body, the motor primitives derived from them, and the position of its deterministic exploration"
      may_decide:
        - "which activations it proposes at a tick, by exploration, probing or replay of a primitive a caller activated"
        - "whether a recurring sequence is a primitive and which maturity label its numbers yield"
        - "which sequences and primitives are dropped when over capacity"
      must_not:
        - "issue a commitment or a motor command"
        - "interpret the names of body signals or actuator channels"
        - "start a replay that no caller requested"
        - "claim to produce the competence records that bindings and affordances require"
    state:
      owner: organism
      family: adaptive_longitudinal
    lifecycle:
      birth: empty
      checkpoint: preserve
      restart: preserve
      reembodiment: reset
      reproduction: not_inherited
    inputs:
      - "per tick, body signals and the activations delivered, supplied by a caller"
      - "an organism identifier, a channel list, optional exclusive groups and a body string, at construction"
    outputs:
      - "proposed activations for a tick"
      - "identifiers and maturity of available primitives"
      - "an exported plain-data state and a snapshot of counts"
    consumers:
      - "organism:src/organism/agency/candidates.py, by attribute name only; no code constructs the engine outside its tests at the reviewed revision"

  ORG-ACE:
    coverage_unit: component.organism-causal-evidence
    name: "Effects, causal evidence and controllability"
    authority:
      owns: "a bounded list of reported transitions and passive windows with the effect observed in each, the registry of effect identifiers, and the estimates computed from their counts"
      may_decide:
        - "which effect identifier a reported change in signals receives"
        - "the controllability and agency numbers of a source for an effect, from counts"
        - "which rows, effects and estimates are dropped when over capacity"
        - "which atoms belong to the footprint of a channel set"
      must_not:
        - "observe a body or issue a command"
        - "write a competence, a binding or an affordance"
        - "claim that a difference of observed rates establishes a cause"
    state:
      owner: organism
      family: adaptive_longitudinal
    lifecycle:
      birth: empty
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: not_inherited
    inputs:
      - "transitions and passive windows reported by a caller"
      - "changes in organism-named features, for effect identity"
      - "issued motor commands, for intervention signatures"
    outputs:
      - "effect identifiers and atoms"
      - "counts of opportunities and hits per source"
      - "effect predictions, controllability estimates and agency estimates"
      - "footprints with the estimate behind each member"
    consumers:
      - "organism:src/organism/agency/affordances.py reads the effect space and the controllability model; no code constructs either at the reviewed revision"

  ORG-AEB:
    coverage_unit: component.organism-execution-binding
    name: "Execution bindings, availability and the affordance resolver"
    authority:
      owns: "one row per competence recording the surface it was last confirmed on, the evidence references, a status and its revision"
      may_decide:
        - "whether a competence is reported executable for a given surface fingerprint"
        - "the availability answers and reason derived from a competence, a binding and caller-supplied facts"
        - "which affordances are derived from a library of competences"
      must_not:
        - "change a binding's status without a caller"
        - "issue a commitment or a motor command"
        - "determine which surface or embodiment is current"
        - "claim to prevent an action: nothing on the action path consults it"
    state:
      owner: organism
      family: embodiment_local
    lifecycle:
      birth: empty
      checkpoint: preserve
      restart: preserve
      reembodiment: invalidate_authority
      reproduction: not_inherited
    inputs:
      - "evidence that a competence produced an effect on a surface, reported by a caller"
      - "status changes decided by a caller"
      - "the current surface fingerprint, controller availability and suppression, supplied by a caller"
    outputs:
      - "bindings and their transitions"
      - "availability records"
      - "affordances for the action path"
    consumers:
      - "admission in mechanism.organism-action-path takes affordances; no code builds them with the resolver at the reviewed revision"

  ORG-APD:
    coverage_unit: component.organism-prospective-deliberation
    name: "Prospective deliberation and the outcome-value ledger"
    authority:
      owns: "running statistics of the values recorded for each outcome string, alone and per context digest"
      may_decide:
        - "which candidate, if any, has the highest positive utility by a margin, given predictions supplied by a caller"
        - "the reason reported when nothing is selected"
        - "which value entries are dropped when over capacity"
      must_not:
        - "predict an outcome itself"
        - "record a value it was not given"
        - "execute, commit or admit an action"
    state:
      owner: organism
      family: adaptive_longitudinal
    lifecycle:
      birth: empty
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: not_inherited
    inputs:
      - "candidates, context tokens, a homeostatic deviation and a prediction function, per call"
      - "values recorded for outcomes by a caller"
    outputs:
      - "a deliberation outcome: a selected candidate or a reason"
      - "an exported ledger"
    consumers:
      - "none at the reviewed revision: no code consumes a deliberation outcome"

  ORG-GNM:
    coverage_unit: component.organism-genome
    name: "Genome, expression and germline record"
    authority:
      owns: "an immutable table of 42 gene values with its two hashes, five effective values regulated inside the ranges the genome sets, and a record of birth expression and epigenetic marks"
      may_decide:
        - "whether a mapping is a well-formed genome inside the schema bounds and compatible with the running kernel"
        - "the next expression state, given the previous one and six signals supplied by a caller"
        - "whether a deviation that persisted for 64 consecutive calls is recorded as an acquired mark, when the protocol is enabled"
      must_not:
        - "mutate, recombine or copy a genome to an offspring; no such operation exists"
        - "decide or trigger reproduction"
        - "compute the signals it regulates on"
        - "generate a genome identifier or draw on any entropy source"
        - "hold body properties"
    state:
      owner: organism
      family: identity_longitudinal
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: conditional
    inputs:
      - "a genome mapping, or the packaged seed with an identifier supplied by the caller"
      - "kernel limits and the running version"
      - "six regulatory signals in 0..1, supplied by a caller"
      - "inherited marks, supplied by a caller"
    outputs:
      - "a validated genome with a genome hash and a genotype hash"
      - "an expression state of five effective values"
      - "plain-data exports of genome, expression state and germline record"
    consumers:
      - "no code outside organism:src/organism/genetics reads a gene value or the expression state at the reviewed revision; organism:src/organism/cognition/birth.py loads the seed and organism:src/organism/cognition/checkpoint.py holds a second genome codec"

  ORG-MEX:
    coverage_unit: component.organism-experience-ledger
    name: "Experience record and its ledger"
    authority:
      owns: "the format of one bounded episode record bound to an Organism identifier, and a bounded list of such records in order of arrival"
      may_decide:
        - "whether a record is well formed, including that a model-sourced record is not marked observed"
        - "which record is dropped when the list is full: the oldest by arrival"
        - "whether an exported ledger belongs to the Organism identifier stated by the caller"
      must_not:
        - "create a record from an event; a caller supplies every record"
        - "resolve an evidence reference or change a status"
        - "retrieve by content, consolidate or archive"
        - "rewrite a record in place"
    state:
      owner: organism
      family: adaptive_longitudinal
    lifecycle:
      birth: empty
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: not_inherited
    inputs:
      - "records constructed by a caller"
      - "an Organism identifier and a capacity between 16 and 8192"
    outputs:
      - "the record dropped on overflow, returned to the caller"
      - "a plain-data export of the ledger"
      - "a content hash per record that excludes the record identifier"
    consumers:
      - "the composed cognitive payload of component.organism-identity-checkpoint accepts a tuple of records from its caller; nothing constructs a record or a ledger outside tests at the reviewed revision"

  ORG-PRV:
    coverage_unit: component.organism-causal-provenance-log
    name: "Causal provenance log"
    authority:
      owns: "a ring of recent causal events and a frontier mapping each live reference to the event that produced it and to the causes that event declared"
      may_decide:
        - "the identifier of an event, derived from its content"
        - "which events remain in the ring: the most recent, up to its capacity"
      must_not:
        - "verify that declared causes were causes"
        - "bound the frontier itself; entries leave only when a caller retires them"
        - "read anything back from a subscriber"
        - "hold raw values or semantics of the things referred to"
    state:
      owner: organism
      family: causal_history
    lifecycle:
      birth: empty
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: not_inherited
    inputs:
      - "causal events built by a producer, with a tick supplied by the producer"
      - "references retired by a producer"
    outputs:
      - "the immediate causes and producing event of a live reference"
      - "each emitted event, passed to subscribers"
      - "a plain-data export of the frontier and the emitted count, without the ring"
    consumers:
      - "the footprint registry of component.organism-causal-evidence emits to a log when given one; no code constructs a log or registers a subscriber at the reviewed revision"

  ORG-PCS:
    coverage_unit: component.organism-capacity-and-pair-statistics
    name: "Capacity pressure and pair statistics"
    authority:
      owns: "two small values embedded in other Organism structures: counters of admissions, evictions and re-admissions for a bounded table, and six running sums for a stream of number pairs"
      may_decide:
        - "whether an admitted item counts as relearned after eviction, by fingerprint among the last 256 evictions"
        - "the correlation of the pairs seen, or no answer below three pairs or without variation"
      must_not:
        - "choose what a table evicts"
        - "be read by a decision, for the capacity counters, by the declaration of their module"
        - "say what the two streams of a pair mean"
    state:
      owner: organism
      family: adaptive_longitudinal
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: preserve
      reproduction: not_inherited
    inputs:
      - "item names reported by the owning table after an eviction or an admission"
      - "pairs of finite numbers"
    outputs:
      - "a snapshot of capacity, occupancy and counters"
      - "a correlation in -1..1 or no answer"
      - "plain-data exports of both values"
    consumers:
      - "organism:src/organism/actuation/candidate.py takes effect strength from pair accumulators"
      - "five bounded structures embed capacity counters and export them; no code reads a counter at the reviewed revision"

  EMB-BND:
    coverage_unit: component.embodiment-actuator-binding
    name: "Actuator binding"
    authority:
      owns: "the association between the actuators a command addresses and the effectors of one body, for one embodiment episode and one morphology revision, with each effector's command contract"
      may_decide:
        - "whether a binding is well formed and whether restored content matches its fingerprint"
      must_not:
        - "act as a solver or World authorization token"
        - "saturate or clip a value"
    state:
      owner: embodiment
      family: embodiment_local
    # birth, checkpoint and restart are read from the code. re-embodiment and
    # reproduction have no code path: a binding names one episode and one
    # revision, so the values record that a new episode needs a new binding
    # and that nothing is inherited, as intent and not as behaviour.
    lifecycle:
      birth: initialize
      checkpoint: preserve
      restart: preserve
      reembodiment: reset
      reproduction: not_inherited
    inputs:
      - "body, episode and morphology revision; the fingerprint of the Organism's actuator surface; one entry per actuator"
    outputs:
      - "an immutable binding with a fingerprint"
      - "a checkpoint that restores only if its content still matches the fingerprint"
    consumers:
      - mechanism.embodiment-actuation-projection
      - mechanism.physical-causal-step
