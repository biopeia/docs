schema_version: 1

# Findings discovered while documenting. Recorded and classified here; when
# material, raised as an issue in the owning repository and linked. Never
# fixed as part of documentation work. A finding describes the code at
# observed_at; it is not a decision and creates no requirement by itself.
findings:

  F-0001:
    class: contract_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-genesis-and-rosters
    summary: >
      Participant closure is an exact match against a roster declared by the caller of a tick; World keeps no relation between presences and owners after genesis and does not derive the required participants. ADR-0073 says World derives and validates the participant set and that callers cannot establish completeness by supplying a list.
    documented_in:
      - explanation/world/genesis-and-rosters.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/28"

  F-0002:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.physical-causal-step
    summary: >
      The physical causal step is orchestrated only by a test fixture. No component in any repository orchestrates it and no solver adapter exists in source. In the fixture the organism checkpoint is a stand-in, the body's physiology is created inside the step, the scene is static and Modality takes no part.
    documented_in:
      - explanation/world/physical-step.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/29"

  F-0003:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-durable-runtime
      - component.world-journal-snapshot-store
    summary: >
      A transition that fails after the owners saved leaves owner checkpoints, and possibly a journal snapshot, referenced by no committed cut. Recovery removes nothing.
    documented_in:
      - explanation/world/recovery.md
      - explanation/world/durable-runtime.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/30"

  F-0004:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-durable-runtime
    summary: >
      The recovery receipt built during checkpoint validation is compared with the reference it was built from, so the comparison cannot fail, and it is neither stored nor returned.
    documented_in:
      - explanation/world/durable-runtime.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/31"

  F-0005:
    class: performance_concern
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
      - component.world-durable-runtime
      - component.world-causal-journal
    summary: >
      Every tick copies and re-encodes the whole journal and writes the full prefix to a new immutable snapshot; no snapshot is removed. Not measured.
    documented_in:
      - explanation/world/journal-snapshot-store.md
      - explanation/world/causal-journal.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/32"

  F-0006:
    class: evidence_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      No test exercises a crash, power loss or a second process during a transition. That a second actor's activity check marks an open transition as interrupted, and that a runtime notices an externally changed manifest only at its next tick, rest on code reading and an ad hoc run.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
      - explanation/world/recovery.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/33"

  F-0007:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      One logical writer is assumed and not enforced by the storage: the advisory lock protects each change to the manifest, not a whole transition.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
    material: true
    status: accepted
    disposition: >
      Architecture Owner, 2026-10-09: a single logical writer is today a precondition of the contract, not a property the storage enforces. Not treated as a defect to be fixed; the boundary between operating requirement, enforcement and guarantee is to stay documented. The missing evidence is tracked separately as F-0006.

  F-0008:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      The journal does not enforce unique record identifiers, a single World per journal, or tick order. The durable runtime checks World and tick range when validating a cut; identifier uniqueness holds only because callers derive identifiers from World and tick.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0009:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      Staged batches are implemented and tested but have no caller in the repository; after a failed batch commit the staged records remain staged.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0010:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
    summary: >
      The snapshot store does not check which World a snapshot belongs to: a store created for another World reads it. The check is made by the durable runtime.
    documented_in:
      - explanation/world/journal-snapshot-store.md
    material: false
    status: open

  F-0011:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - mechanism.world-recovery
    summary: >
      Recovery receipts accumulate in a directory and nothing in World reads them back; their intended consumer is not recorded.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/recovery.md
    material: false
    status: open

  F-0012:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-in-memory-runtime
    summary: >
      The in-memory runtime latches on failure but has no recovery call, and does not roll back what its opaque transition changed.
    documented_in:
      - explanation/world/in-memory-runtime.md
    material: false
    status: accepted
    disposition: >
      Declared by the module itself: it is not durable recovery and does not by itself satisfy the target post-failure contract. The durable runtime is the component that does.

  F-0013:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-static-scene
      - mechanism.physical-causal-step
    summary: >
      The static scene owner cannot verify that World authorised a step's
      correlation, does not bind successive steps to one World, and does not
      tie its owner identifier to the scene's environment identifier.
      Environment and Embodiment each define their own PhysicalStepCorrelation
      type; their agreement for one step is ensured only by whoever builds them.
    documented_in:
      - explanation/environment/static-scene.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/environment/issues/37"

  F-0014:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The finite resource's per-tick transfer bound applies per call, because
      the resource has no notion of a tick; offering and accepting are not
      linked; and the remaining quantity can be assigned directly.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0015:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The finite resource's position, radii and quantity carry no unit, while
      the static scene in the same repository labels its lengths in metres.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0016:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The resource's scalar field does not diminish as the resource is used;
      it is unchanged until the quantity reaches zero and then vanishes.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0060:
    class: recovery_durability_gap
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-operator-material-transfer
    summary: >
      The World record of a transfer carries nothing about the intervention, and the manifest references the Lab evidence checkpoint for one tick only. A tick that fails after the callback leaves a complete evidence file in the store. Once the World has committed a later tick, the durable state examined no longer distinguishes an evidence file whose transfer committed from one whose transfer did not. The repository declares that the record carries no payload and how a leftover file must be read; it does not declare the loss of the link.
    documented_in:
      - explanation/lab/operator-material-transfer.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/lab/issues/31"

  F-0061:
    class: contract_gap
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-operator-material-transfer
    summary: >
      The same intervention identifier is accepted for several committed transfers in one World; nothing checks uniqueness. ADR-0073 says the identifier identifies the intervention.
    documented_in:
      - explanation/lab/operator-material-transfer.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/lab/issues/32"

  F-0062:
    class: implementation_finding
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-operator-material-transfer
    summary: >
      The body's reserve ratio that Lab passes to Observation's projection after a transfer appears in no projected event, because the projection copies only keys it knows. The projection also returns an event of type cognition holding only source, instance and tick, although no organism takes part. The integration test asserts the event types, not their content.
    documented_in:
      - explanation/lab/operator-material-transfer.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/lab/issues/33"

  F-0063:
    class: contract_gap
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-operator-material-transfer
    summary: >
      The transfer requires the World's registered owners to be exactly one resource and one body, so it is refused in any World that registers an Organism owner; this refusal has no test. Lab offers no recovery step after a failed transfer, a non-experimental request may carry study and protocol identifiers, and the evidence contract checks only the schema version and the intervention identifier.
    documented_in:
      - explanation/lab/operator-material-transfer.md
    material: false
    status: open

  F-0064:
    class: implementation_finding
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-study-utilities
    summary: >
      The event stream digest joins fields and events with unescaped separators, so different streams can give equal digests; an integer and the equal float, and a missing and an empty observation, also coincide. No Biopeia code calls it or produces the event shape it hashes, and it is unrelated to the World domain despite its name. The configuration digest has no test.
    documented_in:
      - explanation/lab/study-utilities.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/lab/issues/34"

  F-0065:
    class: evidence_gap
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-operator-material-transfer
    summary: >
      The integration tests of the material transfer are not run by Lab's continuous integration, which runs the unit suite only. The revisions pinned for them are one to four commits behind the main branches of the other repositories; the tests passed at both when run for the documentation.
    documented_in:
      - explanation/lab/operator-material-transfer.md
    material: false
    status: accepted
    disposition: >
      Declared by the repository itself: its README states that a green package CI run validates only the isolated unit suite and is not integration evidence, because the default token cannot clone the other private repositories.

  F-0066:
    class: implementation_finding
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-study-utilities
    summary: >
      The scalar summaries pair by position, cut unequal lists short without notice, do not report how many values or pairs they dropped, report a standard deviation of zero for a single value, and raise an unrelated error on a not-a-number value. The paired and disjoint seed checks accept repeated seeds, and seeds are compared by numeric equality.
    documented_in:
      - explanation/lab/study-utilities.md
    material: false
    status: open

  F-0067:
    class: contract_gap
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-body-interoception-transducer
    summary: >
      The interoception transducer has no consumer in Biopeia. Its checkpoint does not bind the receptor identifiers, so restoring with reordered identifiers silently changes which source each receives. A not-a-number reserve, integrity or temperature is reported as one. Its one piece of state, the permutation, is held by Lab, while ADR-0099 assigns episode transducer state to Embodiment; the code has no notion of episode or calibration.
    documented_in:
      - explanation/lab/body-interoception-transducer.md
    material: false
    status: open

  F-0068:
    class: documentation_inconsistency
    repository: lab
    observed_at: 4d5ff706b8329ddf25e1852ad53cbde5285d2851
    units:
      - component.lab-operator-material-transfer
      - component.lab-body-interoception-transducer
    summary: >
      The revisions of the other repositories named in Lab's migration notes differ from those pinned in its pyproject file, and the notes give test paths without the unit directory the tests now live in. The interoception module describes itself as used by a Physics3D apparatus that is not in the repository.
    documented_in:
      - explanation/lab/operator-material-transfer.md
      - explanation/lab/body-interoception-transducer.md
    material: false
    status: open
