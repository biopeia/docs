  F-0045:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      The plane's current view holds the last observation published for a
      key, not the latest in domain time: publishing causal tick 10 and then
      tick 3 leaves tick 3 as current. The key leaves out asserter, producer
      and acquisition, so an observation from a different asserter replaces
      the earlier one. The view declares no coherence scope.
    documented_in:
      - explanation/observation/observation-plane.md
    material: false
    status: open

  F-0046:
    class: contract_gap
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-semantic-claim-model
    summary: >
      The claim model's rules are checks on labels. The lab_derived kind is
      accepted under any authority; the asserter is not tied to the
      authority; primary domain time is checked by its domain field only, so
      a World causal tick can be given as Embodiment time, as World's own
      integration test does; only three delivery-sequence kind names are
      refused; a derived claim needs no lineage; epistemic and condition
      kinds are free tokens; and there is no field for units, frames or
      observation identity.
    documented_in:
      - explanation/observation/semantic-claim-model.md
    material: false
    status: open

  F-0047:
    class: contract_gap
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      A stream delivers each sequence at most once and replaces lost
      messages by a rebase request, while the approved semantic model names
      at-least-once as the default target for reliable streaming.
    documented_in:
      - explanation/observation/observation-plane.md
    material: false
    status: accepted
    disposition: >
      Declared by the module itself: the documentation of open_stream states
      at-most-once delivery within a healthy subscription, completeness
      limited to the retained range, and rebase on loss. The model allows a
      declared lossy contract and makes at-least-once the default only where
      a family requires reliable streaming; no family exists.

