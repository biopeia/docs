schema_version: 1

# Findings discovered while documenting. Recorded and classified here; when
# material, raised as an issue in the owning repository and linked. Never
# fixed as part of documentation work. A finding describes the code at
# observed_at; it is not a decision and creates no requirement by itself.
findings:

  F-0001:
    class: contract_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-genesis-and-rosters
    summary: >
      Participant closure is an exact match against a roster declared by the caller of a tick; World keeps no relation between presences and owners after genesis and does not derive the required participants. ADR-0073 says World derives and validates the participant set and that callers cannot establish completeness by supplying a list.
    documented_in:
      - explanation/world/genesis-and-rosters.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/28"

  F-0002:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.physical-causal-step
    summary: >
      The physical causal step is orchestrated only by a test fixture. No component in any repository orchestrates it and no solver adapter exists in source. In the fixture the organism checkpoint is a stand-in, the body's physiology is created inside the step, the scene is static and Modality takes no part.
    documented_in:
      - explanation/world/physical-step.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/29"

  F-0003:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-durable-runtime
      - component.world-journal-snapshot-store
    summary: >
      A transition that fails after the owners saved leaves owner checkpoints, and possibly a journal snapshot, referenced by no committed cut. Recovery removes nothing.
    documented_in:
      - explanation/world/recovery.md
      - explanation/world/durable-runtime.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/30"

  F-0004:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-durable-runtime
    summary: >
      The recovery receipt built during checkpoint validation is compared with the reference it was built from, so the comparison cannot fail, and it is neither stored nor returned.
    documented_in:
      - explanation/world/durable-runtime.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/31"

  F-0005:
    class: performance_concern
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
      - component.world-durable-runtime
      - component.world-causal-journal
    summary: >
      Every tick copies and re-encodes the whole journal and writes the full prefix to a new immutable snapshot; no snapshot is removed. Not measured.
    documented_in:
      - explanation/world/journal-snapshot-store.md
      - explanation/world/causal-journal.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/32"

  F-0006:
    class: evidence_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      No test exercises a crash, power loss or a second process during a transition. That a second actor's activity check marks an open transition as interrupted, and that a runtime notices an externally changed manifest only at its next tick, rest on code reading and an ad hoc run.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
      - explanation/world/recovery.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/33"

  F-0007:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      One logical writer is assumed and not enforced by the storage: the advisory lock protects each change to the manifest, not a whole transition.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
    material: true
    status: accepted
    disposition: >
      Architecture Owner, 2026-10-09: a single logical writer is today a precondition of the contract, not a property the storage enforces. Not treated as a defect to be fixed; the boundary between operating requirement, enforcement and guarantee is to stay documented. The missing evidence is tracked separately as F-0006.

  F-0008:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      The journal does not enforce unique record identifiers, a single World per journal, or tick order. The durable runtime checks World and tick range when validating a cut; identifier uniqueness holds only because callers derive identifiers from World and tick.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0009:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      Staged batches are implemented and tested but have no caller in the repository; after a failed batch commit the staged records remain staged.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0010:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
    summary: >
      The snapshot store does not check which World a snapshot belongs to: a store created for another World reads it. The check is made by the durable runtime.
    documented_in:
      - explanation/world/journal-snapshot-store.md
    material: false
    status: open

  F-0011:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - mechanism.world-recovery
    summary: >
      Recovery receipts accumulate in a directory and nothing in World reads them back; their intended consumer is not recorded.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/recovery.md
    material: false
    status: open

  F-0012:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-in-memory-runtime
    summary: >
      The in-memory runtime latches on failure but has no recovery call, and does not roll back what its opaque transition changed.
    documented_in:
      - explanation/world/in-memory-runtime.md
    material: false
    status: accepted
    disposition: >
      Declared by the module itself: it is not durable recovery and does not by itself satisfy the target post-failure contract. The durable runtime is the component that does.

  F-0013:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-static-scene
      - mechanism.physical-causal-step
    summary: >
      The static scene owner cannot verify that World authorised a step's
      correlation, does not bind successive steps to one World, and does not
      tie its owner identifier to the scene's environment identifier.
      Environment and Embodiment each define their own PhysicalStepCorrelation
      type; their agreement for one step is ensured only by whoever builds them.
    documented_in:
      - explanation/environment/static-scene.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/environment/issues/37"

  F-0014:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The finite resource's per-tick transfer bound applies per call, because
      the resource has no notion of a tick; offering and accepting are not
      linked; and the remaining quantity can be assigned directly.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0015:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The finite resource's position, radii and quantity carry no unit, while
      the static scene in the same repository labels its lengths in metres.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0016:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The resource's scalar field does not diminish as the resource is used;
      it is unchanged until the quantity reaches zero and then vanishes.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0040:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      Clearing the plane signals a run boundary only to the streams open at
      that moment and does not record it in the delivery sequence. A consumer
      that reconnects afterwards with its last watermark receives no rebase
      request: nothing if no publication followed, or only the later
      messages. It keeps the discarded view with no indication. Confirmed by
      an ad hoc run; no test calls clear.
    documented_in:
      - explanation/observation/observation-plane.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/observation/issues/13"

  F-0041:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
      - component.observation-semantic-claim-model
    summary: >
      Observations are held and delivered by reference and their freezing is
      shallow: the claim value is the producer's own object, neither copied
      nor made immutable. A consumer in the same process can change what the
      plane holds and what other consumers see, and, if a producer publishes
      live owner state, that state. This is what the code permits; no
      consumer has been shown to do it. Bears on ADR-0078.
    documented_in:
      - explanation/observation/observation-plane.md
      - explanation/observation/semantic-claim-model.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/observation/issues/14"

  F-0042:
    class: contract_gap
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-inherited-projection
    summary: >
      The inherited projection is decided to be transitional (design point
      P8) but carries no such mark in code and is exported from the top of
      the package beside the plane. Its callers are Lab's material transfer,
      in source, and one World integration test; both pass a metabolic
      reserve ratio that the projection discards without a signal, as it
      does any key it does not know. ObservedFrame has no caller and
      requires a mind mapping that nothing in Biopeia produces.
    documented_in:
      - explanation/observation/inherited-projection.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/observation/issues/15"

  F-0043:
    class: evidence_gap
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      Several plane behaviours rest on code reading and ad hoc runs only: a
      successful replay, the rebase reasons future_watermark,
      replay_unavailable and replay_exceeds_subscriber_bound, sequence gaps
      on a family-filtered stream, delivery after an overflow, clear and its
      run_boundary signal, and any use from more than one thread. No test
      examines whether anything can flow from a consumer back to a producer.
    documented_in:
      - explanation/observation/observation-plane.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/observation/issues/16"

  F-0044:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
      - component.observation-semantic-claim-model
    summary: >
      Nothing publishes to or reads from the observation plane outside its
      own tests, and no adapter from an authority's boundary exists in any
      repository. World's integration tests build semantic observations and
      publish them nowhere.
    documented_in:
      - explanation/observation/observation-plane.md
      - explanation/observation/semantic-claim-model.md
    material: false
    status: accepted
    disposition: >
      Declared by the repository itself: its migration record excludes
      domain-specific readers and says not to add source-domain adapters
      until their design gates are approved. Recorded so that the plane is
      not read as a running part of the cross-domain flow.

  F-0045:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      The plane's current view holds the last observation published for a
      key, not the latest in domain time: publishing causal tick 10 and then
      tick 3 leaves tick 3 as current. The key leaves out asserter, producer
      and acquisition, so an observation from a different asserter replaces
      the earlier one. The view declares no coherence scope.
    documented_in:
      - explanation/observation/observation-plane.md
    material: false
    status: open

  F-0046:
    class: contract_gap
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-semantic-claim-model
    summary: >
      The claim model's rules are checks on labels. The lab_derived kind is
      accepted under any authority; the asserter is not tied to the
      authority; primary domain time is checked by its domain field only, so
      a World causal tick can be given as Embodiment time, as World's own
      integration test does; only three delivery-sequence kind names are
      refused; a derived claim needs no lineage; epistemic and condition
      kinds are free tokens; and there is no field for units, frames or
      observation identity.
    documented_in:
      - explanation/observation/semantic-claim-model.md
    material: false
    status: open

  F-0047:
    class: contract_gap
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      A stream delivers each sequence at most once and replaces lost
      messages by a rebase request, while the approved semantic model names
      at-least-once as the default target for reliable streaming.
    documented_in:
      - explanation/observation/observation-plane.md
    material: false
    status: accepted
    disposition: >
      Declared by the module itself: the documentation of open_stream states
      at-most-once delivery within a healthy subscription, completeness
      limited to the retained range, and rebase on loss. The model allows a
      declared lossy contract and makes at-least-once the default only where
      a family requires reliable streaming; no family exists.

  F-0048:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-inherited-projection
    summary: >
      The inherited projection coerces without telling: an integer key
      truncates 3.9 to 3 and turns a boolean into 1 or 0, not-a-number passes
      through, some values are passed through by reference, an empty joint
      list is kept while an empty link list is dropped. Its keys keep
      historical names, including symbiont_tick, and its frame writes
      feeds_back false as a constant label that nothing measures.
    documented_in:
      - explanation/observation/inherited-projection.md
    material: false
    status: open

  F-0049:
    class: performance_concern
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      A stream that is never closed stays registered for the life of the
      plane, and every publication visits every registered stream while
      holding the plane's lock; opening a stream with a watermark scans the
      whole replay history. Not measured.
    documented_in:
      - explanation/observation/observation-plane.md
    material: false
    status: open
