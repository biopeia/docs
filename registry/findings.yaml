      segment is silently dropped. Field names carry no units, and the units
      of mass, size, torque and damping are stated nowhere; ADR-0073 item 1
      says public APIs have no implicit units.
    documented_in:
      - explanation/embodiment/articulated-body.md
    material: false
    status: open

