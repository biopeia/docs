  F-0116:
    class: recovery_durability_gap
    repository: embodiment
    observed_at: a5129f03aa4b024e33d332f917b9235afe97959c
    units:
      - component.embodiment-articulated-body
    summary: >
      The digest that binds articulated state and its checkpoint to a
      morphology covers the generated description only. Contact links,
      fixed-base flag, surface material, spawn height, structural neighbours
      and state schema version are not in it, so descriptors of bodies
      differing in those compare equal and a checkpoint was restored under
      one of them. A descriptor made by hand with an invented digest is
      accepted, as the code declares. No checkpoint holds a specification or
      a descriptor: restoring needs the caller to supply the descriptor
      again. The articulated state offers no checkpoint digest and no owner
      validation methods, and its schema name exists only in World's fixture
      (extends F-0021).
    documented_in:
      - explanation/embodiment/articulated-body.md
    material: true
