  F-0040:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
    summary: >
      Clearing the plane signals a run boundary only to the streams open at
      that moment and does not record it in the delivery sequence. A consumer
      that reconnects afterwards with its last watermark receives no rebase
      request: nothing if no publication followed, or only the later
      messages. It keeps the discarded view with no indication. Confirmed by
      an ad hoc run; no test calls clear.
    documented_in:
      - explanation/observation/observation-plane.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/observation/issues/13"

  F-0041:
    class: implementation_finding
    repository: observation
    observed_at: 397c0b4691b5e460e6ebc3914f9820ff434a3661
    units:
      - component.observation-plane
      - component.observation-semantic-claim-model
    summary: >
      Observations are held and delivered by reference and their freezing is
      shallow: the claim value is the producer's own object, neither copied
      nor made immutable. A consumer in the same process can change what the
      plane holds and what other consumers see, and, if a producer publishes
      live owner state, that state. This is what the code permits; no
      consumer has been shown to do it. Bears on ADR-0078.
    documented_in:
      - explanation/observation/observation-plane.md
      - explanation/observation/semantic-claim-model.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/observation/issues/14"

