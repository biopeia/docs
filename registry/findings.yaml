schema_version: 1

# Findings discovered while documenting. Recorded and classified here; when
# material, raised as an issue in the owning repository and linked. Never
# fixed as part of documentation work. A finding describes the code at
# observed_at; it is not a decision and creates no requirement by itself.
findings:

  F-0001:
    class: contract_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-genesis-and-rosters
    summary: >
      Participant closure is an exact match against a roster declared by the caller of a tick; World keeps no relation between presences and owners after genesis and does not derive the required participants. ADR-0073 says World derives and validates the participant set and that callers cannot establish completeness by supplying a list.
    documented_in:
      - explanation/world/genesis-and-rosters.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/28"

  F-0002:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.physical-causal-step
    summary: >
      No solver adapter and no domain adapters for the physical causal step
      exist in source: the solver calls and the projections handed to World's
      coordinator are written inside two test fixtures. In them the organism
      checkpoint is a stand-in, the body's physiology is created inside the
      step, the scene is static and Modality takes no part. As first recorded
      this finding also said no component orchestrated the step; World added a
      protocol-driven coordinator, run_physical_step, in world f496422.
    documented_in:
      - explanation/world/physical-step.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/29"

  F-0003:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-durable-runtime
      - component.world-journal-snapshot-store
    summary: >
      A transition that fails after the owners saved leaves owner checkpoints, and possibly a journal snapshot, referenced by no committed cut. Recovery removes nothing.
    documented_in:
      - explanation/world/recovery.md
      - explanation/world/durable-runtime.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/30"

  F-0004:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-durable-runtime
    summary: >
      The recovery receipt built during checkpoint validation is compared with the reference it was built from, so the comparison cannot fail, and it is neither stored nor returned.
    documented_in:
      - explanation/world/durable-runtime.md
    material: true
    status: resolved
    issue: "https://github.com/biopeia/world/issues/31"
    disposition: >
      Resolved in world ba3b38b ("Remove no-op owner recovery receipt"): the
      receipt type and its construction were removed, and the validation is
      now the hash comparison and the owner contract's answer only.

  F-0005:
    class: performance_concern
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
      - component.world-durable-runtime
      - component.world-causal-journal
    summary: >
      Every tick copies and re-encodes the whole journal and writes the full prefix to a new immutable snapshot; no snapshot is removed. A later bounded synthetic direct-store characterization at world cb6bfb7c9bccd16c2f85f0f24deba1a12bfc80c8 confirms quadratic retained-byte growth for fixed-size records. Intended-workload cost remains unknown; see the linked issue comment for measurements and limitations.
    documented_in:
      - explanation/world/journal-snapshot-store.md
      - explanation/world/causal-journal.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/32"

  F-0006:
    class: evidence_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      No test exercises a crash, power loss or a second process during a transition. That a second actor's activity check marks an open transition as interrupted, and that a runtime notices an externally changed manifest only at its next tick, rest on code reading and an ad hoc run.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
      - explanation/world/recovery.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/33"

  F-0007:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      One logical writer is assumed and not enforced by the storage: the advisory lock protects each change to the manifest, not a whole transition.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
    material: true
    status: accepted
    disposition: >
      Architecture Owner, 2026-10-09: a single logical writer is today a precondition of the contract, not a property the storage enforces. Not treated as a defect to be fixed; the boundary between operating requirement, enforcement and guarantee is to stay documented. The missing evidence is tracked separately as F-0006.

  F-0008:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      The journal does not enforce unique record identifiers, a single World per journal, or tick order. The durable runtime checks World and tick range when validating a cut; identifier uniqueness holds only because callers derive identifiers from World and tick.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0009:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      Staged batches are implemented and tested but have no caller in the repository; after a failed batch commit the staged records remain staged.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0010:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
    summary: >
      The snapshot store does not check which World a snapshot belongs to: a store created for another World reads it. The check is made by the durable runtime.
    documented_in:
      - explanation/world/journal-snapshot-store.md
    material: false
    status: open

  F-0011:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - mechanism.world-recovery
    summary: >
      Recovery receipts accumulate in a directory and nothing in World reads them back; their intended consumer is not recorded.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/recovery.md
    material: false
    status: resolved
    disposition: >
      No longer true of the code in its main part since world d38c7cc ("fix(world): make recovery retries identity-stable"): when a transition is opened, the manifest store reads back the receipt filed under the same World, transition identifier and tick, and refuses a different proposal. Receipts still accumulate and nothing lists or removes them; seen at world 95f5064c6b06bd66bb58a72110b066afe4ca70b0.

  F-0012:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-in-memory-runtime
    summary: >
      The in-memory runtime latches on failure but has no recovery call, and does not roll back what its opaque transition changed.
    documented_in:
      - explanation/world/in-memory-runtime.md
    material: false
    status: accepted
    disposition: >
      Declared by the module itself: it is not durable recovery and does not by itself satisfy the target post-failure contract. The durable runtime is the component that does.

  F-0013:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-static-scene
      - component.environment-dynamic-state
      - mechanism.physical-causal-step
    summary: >
      The static scene owner cannot verify that World authorised a step's
      correlation, and does not tie its owner identifier to the scene's
      environment identifier. Environment and Embodiment each define their own
      PhysicalStepCorrelation type; their agreement for one step is ensured
      only by whoever builds them. As first recorded this finding also said
      the owner did not bind successive steps to one World; that part was
      fixed in environment 0a9f4fb, which binds an owner to one World, and the
      correlation class now states that it is not proof of World
      authorization.
    documented_in:
      - explanation/environment/static-scene.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/environment/issues/37"

  F-0014:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The finite resource's per-tick transfer bound applies per call, because
      the resource has no notion of a tick; offering and accepting are not
      linked; and the remaining quantity can be assigned directly.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0015:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
      - component.environment-resource-geometry
    summary: >
      The finite resource's quantity remaining and transfer bound carry no
      unit. Its lengths carry none either, but that is declared: they are
      relative lengths, realised in metres only through an explicit
      projection with a caller-supplied scale.
    documented_in:
      - explanation/environment/finite-resource.md
      - explanation/environment/resource-geometry.md
    material: false
    status: open
    disposition: >
      The geometry module explicitly declares relative lengths and requires
      a caller-supplied scale for projection to metres. The remaining
      quantity and transfer bound have no declared units. Their intended
      meaning (including whether they are abstract, dimensionless values or
      physical quantities) is unresolved; no unit or physical interpretation
      is inferred here. Define that meaning before treating the contract gap
      as closed.

  F-0016:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The resource's scalar field does not diminish as the resource is used;
      it is unchanged until the quantity reaches zero and then vanishes.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0017:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-procedural-genesis
    summary: >
      Generated spheres may overlap one another and may cross or lie under
      the ground plane; the placement box is independent of the plane.
    documented_in:
      - explanation/environment/procedural-genesis.md
    material: false
    status: accepted
    disposition: >
      Declared by the module itself: it makes no guarantee of non-overlap,
      terrain quality, ecological meaning or scientific suitability.

  F-0018:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-resource-geometry
    summary: >
      No consumer of the resource geometry projection was found by source
      search in the inspected Biopeia code snapshots; where a projected
      resource sphere enters a physical scene is not established by that
      code. This bounded search does not assert that no external consumer
      exists.
    documented_in:
      - explanation/environment/resource-geometry.md
    material: false
    status: open

  F-0019:
    class: evidence_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-procedural-genesis
    summary: >
      A generated scene is checkpointed in full and its provenance kept as an
      opaque record; nothing checks that the recorded seed and configuration
      still regenerate the stored scene.
    documented_in:
      - explanation/environment/procedural-genesis.md
    material: false
    status: open

  F-0050:
    class: implementation_finding
    repository: modality
    observed_at: 9bd1b77c9eabc271969109cfab52394dc5b52012
    units:
      - concept.modality-current-state
    summary: >
      The modality repository holds no capability: the package exports
      nothing, has no submodule, and its only test asserts that emptiness. No
      other Biopeia repository imports or depends on it.
    documented_in:
      - explanation/modality/current-state.md
    material: false
    status: accepted
    disposition: >
      The repository declares this itself. Its README and package docstring
      say that no concrete operator or catalogue is ratified, and its
      migration record states that the Architecture Owner ratified the removal
      of the copied operators and catalogue on 2026-10-09 (commit 709996a).

  F-0051:
    class: documentation_inconsistency
    repository: modality
    observed_at: 9bd1b77c9eabc271969109cfab52394dc5b52012
    units:
      - concept.modality-current-state
    summary: >
      ADR-0073 item 9 and the approved physical-step design (section
      "Modality repository disposition") keep the repository separate because
      of its reusable transduction contracts. The repository contains none
      since commit 709996a, and nothing records whether the design's own
      conditions for reconsidering the repository were re-evaluated.
    documented_in:
      - explanation/modality/current-state.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/modality/issues/11"

  F-0052:
    class: documentation_inconsistency
    repository: modality
    observed_at: 9bd1b77c9eabc271969109cfab52394dc5b52012
    units:
      - concept.modality-current-state
    summary: >
      AGENTS.md says the repository owns bounded sensory transduction and
      modality capability contracts in its current extracted slice. That code
      was removed by commit 709996a, which did not change AGENTS.md; the file
      contradicts the README, the migration record and the code.
    documented_in:
      - explanation/modality/current-state.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/modality/issues/12"

  F-0053:
    class: documentation_inconsistency
    repository: world
    observed_at: c162b67e698de9b47450264402677b0165e6e20e
    units:
      - concept.modality-current-state
    summary: >
      World's physical step fixture comments that Modality's current target
      contract is sensory transduction only, and the causal tick fixture
      records a field named transduced_signal, although no transduction
      contract exists and the value is passed through unchanged.
    documented_in:
      - explanation/modality/current-state.md
    material: false
    status: open

  F-0054:
    class: documentation_inconsistency
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - concept.modality-current-state
    summary: >
      organism MIGRATION.md describes Modality as a repository whose
      extracted v1 API is sensory transduction only. That API was removed
