schema_version: 1

# Findings discovered while documenting. Recorded and classified here; when
# material, raised as an issue in the owning repository and linked. Never
# fixed as part of documentation work. A finding describes the code at
# observed_at; it is not a decision and creates no requirement by itself.
findings:

  F-0001:
    class: contract_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-genesis-and-rosters
    summary: >
      Participant closure is an exact match against a roster declared by the caller of a tick; World keeps no relation between presences and owners after genesis and does not derive the required participants. ADR-0073 says World derives and validates the participant set and that callers cannot establish completeness by supplying a list.
    documented_in:
      - explanation/world/genesis-and-rosters.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/28"

  F-0002:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.physical-causal-step
    summary: >
      The physical causal step is orchestrated only by a test fixture. No component in any repository orchestrates it and no solver adapter exists in source. In the fixture the organism checkpoint is a stand-in, the body's physiology is created inside the step, the scene is static and Modality takes no part.
    documented_in:
      - explanation/world/physical-step.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/29"

  F-0003:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-durable-runtime
      - component.world-journal-snapshot-store
    summary: >
      A transition that fails after the owners saved leaves owner checkpoints, and possibly a journal snapshot, referenced by no committed cut. Recovery removes nothing.
    documented_in:
      - explanation/world/recovery.md
      - explanation/world/durable-runtime.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/30"

  F-0004:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-durable-runtime
    summary: >
      The recovery receipt built during checkpoint validation is compared with the reference it was built from, so the comparison cannot fail, and it is neither stored nor returned.
    documented_in:
      - explanation/world/durable-runtime.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/31"

  F-0005:
    class: performance_concern
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
      - component.world-durable-runtime
      - component.world-causal-journal
    summary: >
      Every tick copies and re-encodes the whole journal and writes the full prefix to a new immutable snapshot; no snapshot is removed. Not measured.
    documented_in:
      - explanation/world/journal-snapshot-store.md
      - explanation/world/causal-journal.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/32"

  F-0006:
    class: evidence_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - mechanism.world-recovery
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      No test exercises a crash, power loss or a second process during a transition. That a second actor's activity check marks an open transition as interrupted, and that a runtime notices an externally changed manifest only at its next tick, rest on code reading and an ad hoc run.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
      - explanation/world/recovery.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/world/issues/33"

  F-0007:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - component.world-durable-runtime
    summary: >
      One logical writer is assumed and not enforced by the storage: the advisory lock protects each change to the manifest, not a whole transition.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/durable-runtime.md
    material: true
    status: accepted
    disposition: >
      Architecture Owner, 2026-10-09: a single logical writer is today a precondition of the contract, not a property the storage enforces. Not treated as a defect to be fixed; the boundary between operating requirement, enforcement and guarantee is to stay documented. The missing evidence is tracked separately as F-0006.

  F-0008:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      The journal does not enforce unique record identifiers, a single World per journal, or tick order. The durable runtime checks World and tick range when validating a cut; identifier uniqueness holds only because callers derive identifiers from World and tick.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0009:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-journal
    summary: >
      Staged batches are implemented and tested but have no caller in the repository; after a failed batch commit the staged records remain staged.
    documented_in:
      - explanation/world/causal-journal.md
    material: false
    status: open

  F-0010:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-journal-snapshot-store
    summary: >
      The snapshot store does not check which World a snapshot belongs to: a store created for another World reads it. The check is made by the durable runtime.
    documented_in:
      - explanation/world/journal-snapshot-store.md
    material: false
    status: open

  F-0011:
    class: implementation_finding
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-causal-manifest
      - mechanism.world-recovery
    summary: >
      Recovery receipts accumulate in a directory and nothing in World reads them back; their intended consumer is not recorded.
    documented_in:
      - explanation/world/causal-manifest.md
      - explanation/world/recovery.md
    material: false
    status: open

  F-0012:
    class: recovery_durability_gap
    repository: world
    observed_at: cb4bd6b0506b554bf4187b36c23095a7521c4504
    units:
      - component.world-in-memory-runtime
    summary: >
      The in-memory runtime latches on failure but has no recovery call, and does not roll back what its opaque transition changed.
    documented_in:
      - explanation/world/in-memory-runtime.md
    material: false
    status: accepted
    disposition: >
      Declared by the module itself: it is not durable recovery and does not by itself satisfy the target post-failure contract. The durable runtime is the component that does.

  F-0013:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-static-scene
      - mechanism.physical-causal-step
    summary: >
      The static scene owner cannot verify that World authorised a step's
      correlation, does not bind successive steps to one World, and does not
      tie its owner identifier to the scene's environment identifier.
      Environment and Embodiment each define their own PhysicalStepCorrelation
      type; their agreement for one step is ensured only by whoever builds them.
    documented_in:
      - explanation/environment/static-scene.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/environment/issues/37"

  F-0014:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The finite resource's per-tick transfer bound applies per call, because
      the resource has no notion of a tick; offering and accepting are not
      linked; and the remaining quantity can be assigned directly.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0015:
    class: contract_gap
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The finite resource's position, radii and quantity carry no unit, while
      the static scene in the same repository labels its lengths in metres.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0016:
    class: implementation_finding
    repository: environment
    observed_at: f97ec22272b6be1e6742770e37cd370e7d96d6bc
    units:
      - component.environment-finite-resource
    summary: >
      The resource's scalar field does not diminish as the resource is used;
      it is unchanged until the quantity reaches zero and then vanishes.
    documented_in:
      - explanation/environment/finite-resource.md
    material: false
    status: open

  F-0030:
    class: contract_gap
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - mechanism.organism-action-path
    summary: >
      No Organism code joins the stages from affordance to motor command, and the motor authority the code describes is not enforced: the arbitrator returns a decision and never creates or ends a commitment; a commitment can be built for a proposal and intent that never existed, and two can be active at once; an intent needs no admission and can be constructed already active; a command naming no existing commitment passes the surface check. The stages run in sequence only in World's physical step fixture.
    documented_in:
      - explanation/organism/action-path.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/organism/issues/30"

  F-0031:
    class: contract_gap
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - component.organism-identity-checkpoint
    summary: >
      Organism identity is a caller-supplied UUID with no record of continuations: two envelopes holding different state under one identity both decode and cannot be ordered, parse checks no authorization although documented as for an authorized continuation, and no branch, retirement or ancestry operation exists although the README lists fresh identities for branches. ADR-0091 requires at most one non-terminated continuation per identity and a new identity for every branch, and reserves the mechanism to a later pass.
    documented_in:
      - explanation/organism/identity-and-checkpoint.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/organism/issues/31"

  F-0032:
    class: contract_gap
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - mechanism.organism-action-path
    summary: >
      Actuator identifiers are a hash of the channel's ordinal position and a fixed schema string, identical across bodies; a surface built from reordered physical ports under the same contract string is equal to the original. A motor command carries no body, morphology revision, effector or command kind and its activations are unitless numbers in the unit interval; every channel has a neutral value defaulting to zero. ADR-0073 binds commands to stable identity and says list position is never authoritative.
    documented_in:
      - explanation/organism/action-path.md
    material: true
    status: issue_opened
    issue: "https://github.com/biopeia/organism/issues/32"

  F-0033:
    class: contract_gap
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - component.organism-identity-checkpoint
    summary: >
      The dependency closure check covers the dependencies an envelope declares, not those its private state requires: a checkpoint declaring none passes with a reader that finds nothing. ADR-0103 speaks of the closure required to restore the state.
    documented_in:
      - explanation/organism/identity-and-checkpoint.md
    material: true
    status: accepted
    disposition: >
      Declared by the repository itself at the observed commit. Its MIGRATION.md states that the check validates declared references only and does not demonstrate that current private-model artifacts are all represented in the envelope, and that the boundary is a migration candidate, not a claim of TARGET conformance. Recorded as a stated limit, not raised as a defect.

  F-0034:
    class: implementation_finding
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - component.organism-identity-checkpoint
    summary: >
      The identity and envelope validate less than their decoding does: create wraps a non-UUID value and the checkpoint constructor accepts strings for identity and state; the private-state digest travels with the state, so replacing both, or the identity, yields an envelope that decodes; the closure check treats only FileNotFoundError and KeyError as missing and lets other read errors escape; a locator is any string and may be listed twice.
    documented_in:
      - explanation/organism/identity-and-checkpoint.md
    material: false
    status: open

  F-0035:
    class: implementation_finding
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - mechanism.organism-action-path
    summary: >
      Fields and state on the action path that nothing reads or keeps: admission does not read an affordance's executability confidence and ranks a less predictable affordance above a more predictable one; a commitment's interruptibility is never read; past its maximum duration a commitment is left active while a new proposal is selected; the sequence controller accepts repeated and decreasing ticks and its position has no checkpoint.
    documented_in:
      - explanation/organism/action-path.md
    material: false
    status: open

  F-0036:
    class: implementation_finding
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - component.organism-executive-outcome-ledger
    summary: >
      The executive outcome ledger changes on lookup (counters, and permanent lifting of a suppression once a differing revision state is presented); a suppress sample occupies a place in the window of sixteen and counts toward nothing; sample ticks are not ordered; restoring does not preserve a non-default capacity or policy. Nothing in the repository records to the ledger, reads from it, or includes its export in a checkpoint.
    documented_in:
      - explanation/organism/executive-outcome-ledger.md
    material: false
    status: open

  F-0037:
    class: evidence_gap
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - mechanism.organism-action-path
      - component.organism-executive-outcome-ledger
    summary: >
      The intent record and the arbitrator have no test in the Organism repository, the affordance resolver is never constructed, and no run of a composed Organism exists; the behaviour of those stages described in the documentation rests on the code and one ad hoc run.
    documented_in:
      - explanation/organism/action-path.md
      - explanation/organism/executive-outcome-ledger.md
    material: false
    status: open

  F-0038:
    class: documentation_inconsistency
    repository: organism
    observed_at: 6543188ff302a5f2dc8002c0086252d6061e5310
    units:
      - mechanism.organism-action-path
      - component.organism-executive-outcome-ledger
    summary: >
      Docstrings in the reviewed modules refer to code that is not in the repository (an ActionDomain that converts frames into commands; core.domains.intention as the source of outcome reason strings) and keep the historical name Symbiont, including in the schema string that enters every actuator identifier and surface fingerprint.
    documented_in:
      - explanation/organism/action-path.md
      - explanation/organism/executive-outcome-ledger.md
    material: false
    status: open
