    observed_at: a5129f03aa4b024e33d332f917b9235afe97959c
    units:
      - component.embodiment-articulated-body
    summary: >
      A body specification and its joint and segment values are not
      validated. A negative or non-numeric mass, inverted joint limits (until
      a descriptor is derived), an unknown parent link and a body kind that
      makes the generated text malformed XML are accepted; a link without a
