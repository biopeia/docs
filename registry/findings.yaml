      fixture sets the hinge from the restored owner state directly. The
      projection is built from a specification, a pose and two velocities
      passed separately, not from the body's state, and checks only that
      correlation and pose name the same body: a correlation naming another
      World, tick, episode and morphology revision, and velocities unrelated
      to any state, were accepted.
