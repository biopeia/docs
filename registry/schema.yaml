schema_version: 1

# Closed vocabularies for the Biopeia documentation registry.
# tools/validate_registry.py reads this file; it holds no vocabulary of its own.

# Owning domains. `prefix` is the mandatory prefix of the component identifiers
# owned by that domain. `nature` follows the accepted migration topology:
# seven repositories are not seven semantic authorities.
domains:
  organism: {prefix: ORG, nature: semantic-authority}
  embodiment: {prefix: EMB, nature: semantic-authority}
  environment: {prefix: ENV, nature: semantic-authority}
  world: {prefix: WLD, nature: semantic-authority}
  modality: {prefix: MOD, nature: capability}
  observation: {prefix: OBS, nature: capability}
  lab: {prefix: LAB, nature: apparatus}

# Repositories a reference (`<repository>:<path>`) may name, beyond the domains
# above. `historical` repositories may be cited as design/decision sources but
# never as the implementation or tests of a Biopeia unit.
extra_repositories:
  docs: {historical: false}
  symbiont-lab: {historical: true}

# Where documents referenced from the registry live inside this repository.
layout:
  canonical_docs: explanation/
  canonical_refs: explanation/
  adrs: technical/adr/
  design: technical/design/

unit_kinds: [algorithm, component, concept, equation, mechanism, metric]

# Architectural status of a unit. TARGET is accepted architecture that the
# extracted code is not yet claimed to implement.
unit_statuses: [CURRENT, TARGET, DESIGN, HISTORICAL, EXPERIMENTAL, UNRESOLVED]

# Review status of a unit's documentation. This is a coordination label about
# the review, not a statement about the strength of the evidence; see
# reference/evidence-status.md.
review_statuses:
  - RECORDED
  - REVIEW_PENDING
  - CONFIRMED
  - CONFIRMED_WITH_LIMITATIONS
  - NOT_REPRODUCED
  - SUPERSEDED

# Semantic owner every persistent state item must declare.
state_owners: [organism, embodiment, environment, world, lab, implementation-local]

state_families:
  - ephemeral
  - episode_bound
  - adaptive_longitudinal
  - identity_longitudinal
  - embodiment_local
  - causal_history
  - environmental_state
  - infrastructure
  - evidence_record

# Which block describes a component's state, by the domain that owns it. The
# dimensions are per nature of component: the lifecycle axes below came from
# the organism and are required only where they have meaning. A domain not
# listed here has no required block yet; none is invented before components of
# that domain have been documented.
component_state_dimensions:
  organism: lifecycle
  embodiment: lifecycle
  world: causal_state

# For World components. Three questions the first World units had to answer
# and the lifecycle axes could not express.
#   durable                    does the state survive the process?
#   in_causal_cut              is the state named by, or part of, a causal cut?
#   failed_transition_residue  what a failed transition can leave behind,
#                              in words; "none" when nothing
causal_state:
  required: [durable, in_causal_cut, failed_transition_residue]

# What happens to a component's state at each lifecycle boundary. Organism and
# Embodiment components.
lifecycle:
  birth: [empty, initialize]
  checkpoint: [not_applicable, preserve, reset]
  restart: [preserve, reset]
  reembodiment: [invalidate_authority, preserve, rebind, reset]
  reproduction: [conditional, inherit_allowed, not_applicable, not_inherited]

# Design register (registry/designs.yaml). Three independent axes.
# `cross-domain` is a register scope for designs with no single semantic
# domain owner. Such designs must name their affected domains explicitly.
design_cross_domain: cross-domain
design_document_statuses:
  - proposed
  - in_review
  - reviewed
  - approved
  - frozen
  - reference
  - closed
  - rejected
  - superseded

# Implementation in the Biopeia repositories. not_evaluated means nobody has
# checked yet; it is not a claim that nothing exists.
design_implementation_statuses:
  - not_evaluated
  - not_started
  - pending
  - in_progress
  - partial
  - implemented
  - on_hold
  - not_applicable

# UNRESOLVED: not yet assessed against the accepted Biopeia architecture.
design_architecture_scopes: [CURRENT, TARGET, HISTORICAL, UNRESOLVED]

# Cross-domain contracts (registry/contracts.yaml): where one domain relies on
# another. `agreement` records how the two sides are actually bound in code,
# which is what the first documented contracts differed in.
#   shared_type    both sides import one definition
#   structural     one side calls methods by name that the other happens to
#                  provide; neither imports the other
#   by_convention  each side has its own definition; nothing in code ties them
#   fixture_only   the two sides meet only in a test fixture
contract_agreements: [shared_type, structural, by_convention, fixture_only]

# Findings discovered while documenting. They are recorded, classified and,
# when material, raised as an issue in the owning repository. They are never
# fixed as part of documentation work.
finding_classes:
  - implementation_finding
  - contract_gap
  - evidence_gap
  - performance_concern
  - recovery_durability_gap
  - documentation_inconsistency

# open: recorded, no issue. issue_opened: an issue exists in the owning
# repository. accepted: either the Architecture Owner decided it is not a
# defect, or the owning repository itself declares the limit, in code or in
# its own documentation; the disposition says which. A material finding is
# accepted only on an owner decision: a limit that a repository declares is
# still raised as an issue when it is material. resolved: no longer true of
# the code; the resolution is recorded.
finding_statuses: [open, issue_opened, accepted, resolved]

parameter_sources: [CODE, DESIGN, STUDY, FORMAL]

metric_classes: [organism_internal, scientific_evaluation, operational, historical]

notation_scopes: [global, local, contextual]
