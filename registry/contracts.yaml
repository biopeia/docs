schema_version: 1

# Cross-domain contracts: where one domain relies on another, who the parties
# are, how the two sides are bound in code, which decisions govern the
# contract, which tests exercise it and which findings bear on it. This file
# describes what the code does. It defines no contract and has no authority
# over any of them.
contracts:

  contract.owner-checkpoint-validation:
    title: Owner checkpoint validation
    summary: >
      During a causal cut and after a restoration, World asks each owner
      whether given checkpoint bytes are valid for a given identity and
      schema. World defines the two questions as a protocol; each owner
      answers them without importing World. Since environment 7166f57 the
      Environment owners no longer answer the second question in that form:
      their restoration check is an instance method taking a restoration
      reference, and World, calling it with its own three arguments, takes
      the error as a refusal (F-0163). The first question is still answered
      by name, so a commit succeeds and a restore or recovery through an
      Environment class does not.
    agreement: structural
    parties:
      - unit: component.world-durable-runtime
        role: defines the two questions and calls them on the exact bytes it has hashed
      - unit: component.environment-finite-resource
        role: answers the first for an identified resource; at environment e91bb67 its restoration check has another signature than the one World calls
      - unit: component.environment-static-scene
        role: answers the first for a static scene owner; at environment e91bb67 its restoration check has another signature than the one World calls
      - unit: component.embodiment-physical-state
        role: takes part in a causal cut but provides neither method; a caller must wrap it
      - unit: component.embodiment-articulated-body
        role: takes part in a causal cut but provides neither method; a fixture wraps it under a schema name that exists only there
      - unit: component.lab-operator-material-transfer
        role: supplies the contract of its own evidence checkpoint; the owners' contracts come from whoever created the World, in its tests the owners' own classes
    governed_by:
      - docs:technical/adr/ADR-0106-hybrid-multi-owner-persistence.md
      - docs:technical/adr/ADR-0092-organism-owns-the-meaning-of-its-private-longitudinal-state.md
    evidence:
      - world:tests/test_durable_runtime.py
      - environment:tests/test_identified_resource.py
      - environment:tests/test_static_scene.py
    findings:
      - F-0004
      - F-0021
      - F-0116
      - F-0163
    documented_in:
      - explanation/world/durable-runtime.md
      - explanation/environment/finite-resource.md
      - explanation/embodiment/physical-state.md

  contract.physical-step-correlation:
    title: Correlation of a physical step
    summary: >
      Every owner taking part in a physical step accepts a result only if it
      carries the correlation the owner was told to expect: World, source
      tick, step, and the owner's own identity and revision. World's
      coordinator issues one context for the step, with explicit source and
      target ticks; each domain still defines its own correlation type. The
      two owners are now bound differently. Embodiment derives its expected
      correlation from World's context in source, reading the context by
      attribute names through a protocol of its own and importing nothing of
      World: a structural binding. Environment is still handed an expected
      correlation built by the caller, and that caller exists only in test
      fixtures. The contract keeps the weaker label for that reason, and
      because every call that hands World's context to an owner is made by a
      fixture. An owner cannot verify that World authorised what it is
      handed.
    agreement: fixture_only
    parties:
      - unit: mechanism.physical-causal-step
        role: issues the context of one step; fixtures pass it to Embodiment and build Environment's expected correlation from it
      - unit: component.environment-static-scene
        role: adopts a candidate only against the expected correlation, for the World it is bound to
      - unit: component.environment-dynamic-state
        role: adopts a changed object state against the expected correlation, for the World it is bound to
      - unit: component.embodiment-physical-state
        role: adopts a solver candidate only against the correlation it derives from World's context, with its own correlation type
      - unit: component.embodiment-articulated-body
        role: adopts through its root state, under the same correlation
    governed_by:
      - docs:technical/adr/ADR-0073-biopeia-migration-causal-and-physical-contracts.md
      - docs:technical/adr/ADR-0098-physical-substrate-and-causal-integration.md
    evidence:
      - world:tests/integration/physical_step/test_first_biopeia_physical_causal_step.py
      - environment:tests/test_static_scene.py
    findings:
      - F-0013
      - F-0020
      - F-0002
    documented_in:
      - explanation/environment/static-scene.md
      - explanation/embodiment/physical-state.md
      - explanation/world/physical-step.md

  contract.motor-command:
    title: Motor command from Organism to Embodiment
    summary: >
      Organism issues a motor command that addresses actuators by opaque
      identifier. Embodiment projects it onto effectors through an actuator
      binding of its own, made for one body, episode and morphology revision,
      which records the fingerprint of the surface the command was written
      for; quantity, unit and range come from the active morphology, and an
      effector the command omits gets no value. Embodiment declares the shape
      of the command it accepts as a protocol and does not import Organism;
      the surface fingerprint in the binding is a string supplied by whoever
      builds it.
    agreement: structural
    parties:
      - unit: mechanism.organism-action-path
        role: produces the motor command
      - unit: mechanism.embodiment-actuation-projection
        role: projects it onto effectors; refuses what the morphology does not declare
      - unit: component.embodiment-actuator-binding
        role: says which actuator drives which effector, for one episode and revision
    governed_by:
      - docs:technical/adr/ADR-0073-biopeia-migration-causal-and-physical-contracts.md
      - docs:technical/adr/ADR-0092-organism-owns-the-meaning-of-its-private-longitudinal-state.md
    evidence:
      - organism:tests/source_unit/actuation/test_command_binding.py
      - embodiment:tests/test_actuation_projection.py
      - world:tests/integration/physical_step/test_first_biopeia_physical_causal_step.py
    findings:
      - F-0030
      - F-0032
      - F-0022
      - F-0023
      - F-0128
    documented_in:
      - explanation/organism/action-path.md
      - explanation/embodiment/actuation-projection.md

  contract.operator-material-transfer:
    title: Operator material transfer
    summary: >
      Under an operator's request Lab asks an Environment resource what it
      offers, asks an Embodiment body what it accepts, has the resource debit
      what was accepted, and has World commit the result with a Lab evidence
      checkpoint as a participant of that step. Lab is the only domain whose
      source imports other domains, and it imports the types of all three.
    agreement: shared_type
    parties:
      - unit: component.lab-operator-material-transfer
        role: composes the transfer and records the evidence
      - unit: component.environment-finite-resource
        role: offers and debits
      - unit: component.embodiment-somatic-state
        role: accepts into the body
      - unit: component.world-durable-runtime
        role: commits the cut
    governed_by:
      - docs:technical/adr/ADR-0073-biopeia-migration-causal-and-physical-contracts.md
      - docs:technical/adr/ADR-0101-operator-control.md
      - docs:technical/adr/ADR-0102-lab.md
      - docs:technical/adr/ADR-0100-observation-capability-and-evidence-custody.md
    evidence:
      - lab:tests/integration/test_material_transfer_intervention.py
      - lab:tests/integration/test_operator_material_transfer.py
    findings:
      - F-0060
      - F-0061
      - F-0014
      - F-0163
      - F-0165
    documented_in:
      - explanation/lab/operator-material-transfer.md
      - explanation/environment/finite-resource.md

  contract.observation-of-a-committed-cut:
    title: Observation of a committed cut
    summary: >
      After World commits a cut, claims about World, a body and the
      environment are built in the semantic claim model, each naming its
      authority. No adapter from any authority to Observation exists in
      source; the claims are constructed by a World test fixture, and nothing
      publishes to the observation plane outside its own tests.
    agreement: fixture_only
    parties:
      - unit: mechanism.physical-causal-step
        role: builds the claims after the manifest is committed
      - unit: component.observation-semantic-claim-model
        role: defines the claim and its authority
      - unit: component.observation-plane
        role: would hold and deliver the claims; has no publisher
    governed_by:
      - docs:technical/adr/ADR-0078-observation-is-causally-passive.md
      - docs:technical/adr/ADR-0100-observation-capability-and-evidence-custody.md
    evidence:
      - world:tests/integration/physical_step/test_first_biopeia_physical_causal_step.py
      - observation:tests/test_semantic_model.py
    findings:
      - F-0044
      - F-0041
    documented_in:
      - explanation/observation/semantic-claim-model.md
      - explanation/observation/observation-plane.md
      - explanation/world/physical-step.md

  contract.inherited-projection-telemetry:
    title: Telemetry through the inherited projection
    summary: >
      Lab passes a telemetry mapping to Observation's inherited projection and
      receives presentation records. The projection is transitional by
      decision and carries historical key names.
    agreement: shared_type
    parties:
      - unit: component.lab-operator-material-transfer
        role: calls the projection after a committed transfer
      - unit: component.observation-inherited-projection
        role: maps the telemetry to presentation records
    governed_by:
      - docs:technical/adr/ADR-0100-observation-capability-and-evidence-custody.md
    evidence:
      - observation:tests/test_projection.py
      - lab:tests/integration/test_material_transfer_intervention.py
    findings:
      - F-0042
      - F-0062
    documented_in:
      - explanation/observation/inherited-projection.md
      - explanation/lab/operator-material-transfer.md

  contract.body-interoception:
    title: Body interoception
    summary: >
      Lab's interoception transducer reads Embodiment-owned body state and
      emits opaque receptor signals. Nothing consumes those signals in any
      repository, and the transducer keeps a permutation in Lab although the
      decision on Modality assigns episode transducer state to Embodiment.
    agreement: shared_type
    parties:
      - unit: component.lab-body-interoception-transducer
        role: reads body state and emits opaque signals
      - unit: component.embodiment-somatic-state
        role: owns the body state read
      - unit: concept.modality-current-state
        role: the decided home of transduction rules, empty today
    governed_by:
      - docs:technical/adr/ADR-0094-somatic-state-ownership-body-holds-organism-regulates-and-feels.md
      - docs:technical/adr/ADR-0099-modality-contract-library.md
    evidence:
      - lab:tests/unit/test_migration_interoception_disposition.py
    findings:
      - F-0056
      - F-0067
    documented_in:
      - explanation/lab/body-interoception-transducer.md
      - explanation/modality/current-state.md

  contract.body-physical-input:
    title: Body physical input to a solver
    summary: >
      Embodiment projects a body's state as the input a solver needs. No
      code in source consumes that projection: World's fixtures parse the
      body description and write the solver model by hand. The MuJoCo step
      executor now in World's source takes a compiled model and raw vectors,
      not the projection. The projection carries joint positions and
      velocities, and the articulated fixture sets the solver's joint from
      them.
    agreement: fixture_only
    parties:
      - unit: mechanism.embodiment-physical-projection
        role: builds the body physical input
      - unit: mechanism.physical-causal-step
        role: consumes it in a test fixture and writes the solver model
    governed_by:
      - docs:technical/adr/ADR-0098-physical-substrate-and-causal-integration.md
      - docs:technical/adr/ADR-0073-biopeia-migration-causal-and-physical-contracts.md
    evidence:
      - embodiment:tests/test_physical_projection.py
      - world:tests/integration/physical_step/test_first_biopeia_physical_causal_step.py
    findings:
      - F-0115
      - F-0002
      - F-0160
    documented_in:
      - explanation/embodiment/physical-projection.md
      - explanation/world/physical-step.md

  contract.frame-and-unit-conventions:
    title: Frame and unit conventions between body and scene
    summary: >
      A body and the scene it stands in must agree on handedness, the up
      axis, the reference frame, length unit and quaternion order. Embodiment
      and Environment each declare these in their own vocabulary and neither
      imports the other; only a fixture's own check ties the two.
    agreement: by_convention
    parties:
      - unit: mechanism.embodiment-physical-projection
        role: declares the body's frame, units and orientation convention
      - unit: component.environment-static-scene
        role: declares the scene's frame, handedness, up axis and units
    governed_by:
      - docs:technical/adr/ADR-0073-biopeia-migration-causal-and-physical-contracts.md
    evidence:
      - embodiment:tests/test_physics3d_observation_contract.py
      - environment:tests/test_static_scene.py
    findings:
      - F-0119
    documented_in:
      - explanation/embodiment/physical-projection.md
      - explanation/environment/static-scene.md

  contract.cognitive-state-in-a-causal-cut:
    title: Organism cognitive state in a World causal cut
    summary: >
      World's integration fixtures advance Organism's cognitive transition
      inside a causal transaction and publish the composed cognitive
      checkpoint as the Organism owner's bytes. The two sides meet only in
      those fixtures, which import Organism's cognition modules directly: no
      source in World, Environment, Embodiment, Observation, Modality or Lab
      imports them (search for `organism.cognition` at each repository's
      main on 2026-10-10). The answers World asks of an owner are given by a
      class the fixture defines, under a schema name that appears nowhere in
      Organism's source.
    agreement: fixture_only
    parties:
      - unit: component.organism-cognitive-graph
        role: provides the graph and the transition the fixtures advance
      - unit: mechanism.organism-cognitive-checkpoint
        role: provides the bytes published and restored as the Organism owner's checkpoint
      - unit: component.world-durable-runtime
        role: publishes and restores those bytes in a fixture; an owner contract defined by the fixture answers its two questions
      - unit: component.world-in-memory-runtime
        role: commits a transaction in which a fixture advances the cognitive transition
    governed_by:
      - docs:technical/adr/ADR-0106-hybrid-multi-owner-persistence.md
      - docs:technical/adr/ADR-0092-organism-owns-the-meaning-of-its-private-longitudinal-state.md
    evidence:
      - world:tests/integration/test_first_biopeia_causal_tick.py
      - world:tests/integration/test_durable_checkpoint_restore_slice.py
    findings:
      - F-0070
      - F-0073
    documented_in:
      - explanation/organism/cognitive-graph.md
      - explanation/organism/cognitive-checkpoint.md
