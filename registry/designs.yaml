schema_version: 1

# Design register. The only authority for the document status, implementation
# status and architecture scope of every design under technical/design/.
# Design documents do not carry these states themselves.
#
# implementation_status describes the Biopeia repositories. A state recorded in
# the source repository is kept under `source` as provenance and is never
# inherited: a copied design starts as not_evaluated.
#
# implementation_evidence lists what the status rests on and at which
# revision. A status other than not_evaluated requires it.
#
# source.register_entry is the triage text of the design's row in the source
# register, verbatim. editorial_notes are written here and are not source text.
