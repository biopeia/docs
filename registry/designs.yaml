  design.runtime.biopeia-physical-step-integration-v1:
    title: "Biopeia Physical-Step and Causal-Commit Integration v1"
    path: technical/design/runtime/biopeia-physical-step-integration-v1.md
    domain: world
    participating_domains: [embodiment, environment, lab]
    document_status: approved
    implementation_status: partial
    architecture_scope: TARGET
    implementation_evidence:
      evaluated_on: "2026-10-09"
      basis:
        world: c162b67e698d
        organism: f15c4c572124
        embodiment: 3fe3cda64516
        environment: f97ec22272b6
        observation: cb07ace20605
      tests:
        - "world:tests/integration/physical_step/test_first_biopeia_physical_causal_step.py"
        - "world:tests/integration/physical_step/test_procedural_sphere_world_step.py"
        - "world:tests/integration/test_first_biopeia_causal_tick.py"
        - "world:tests/integration/test_durable_checkpoint_restore_slice.py"
      observed: >
        The integration job of the world repository's CI passed on its main
        branch at the revision above. It installs the revisions pinned in
        world's integration extra, which are those listed here, and runs the
        integration tests versioned in that repository. A second physical-step
        fixture exercises a generated scene: its geometry reaches the solver,
        the Environment checkpoint in the committed cut restores it, and a
        step follows the restore. They include an end-to-end deterministic
        physical causal step, rejection of a stale-morphology candidate
        without publishing the next World cut, adoption of an articulated
        MuJoCo candidate followed by a World commit, and publication and
        restore of an owner-checkpoint closure.
      limits: >
        The step is carried out by two test fixtures; no component in any
        repository orchestrates it and no solver adapter exists outside the
        fixtures (see explanation/world/physical-step.md). Of the conformance
        items the design lists, the tests exercise stable effector identity
        under permutation, an omitted channel as no command, repeated
        deterministic results, and rejection of a stale morphology with no
        committed next cut. Not exercised by them: roster completeness
        against the genesis specification and partial-cut recovery, which
        World's unit tests cover in isolation, and the single-writer
        assumption, which nothing tests. The organism owner's checkpoint is a
        fixture stand-in, the body's physiology is created inside the step,
        the scene is static, and modality takes no part. Lab's operator
        intervention is exercised separately by Lab's own integration suite
        at the revisions Lab pins. Passing tests are not a physical
        calibration or equivalence claim.
    decision:
      reference: "docs:technical/adr/ADR-0073-biopeia-migration-causal-and-physical-contracts.md"
      date: "2026-10-09"
    source:
      repository: symbiont-lab
      commit: cfa137e167081acac3590fb52ae069adfda605d4
      path: docs/design/runtime/biopeia-physical-step-integration-v1.md
      register_entry: "Architecture-owner approved 2026-10-09 (ADR-0073): stable Embodiment command identity and descriptors; owner adoption of solver candidates; World-owned complete roster, durable owner-closed cuts and single logical writer; attributable Lab intervention with distinct intervention/run identities; and the minimum end-to-end physical causal-step milestone. World #10 and Embodiment #11 are integrated; Embodiment #13 adds owner-side adoption/checkpoint support. Lab #4 and the first integrated end-to-end slice remain incomplete. Observation Semantic Model v1 is approved conceptually; semantic-family contracts may proceed, but concrete schema/transport/storage remain unapproved."
      document_status: Approved
      implementation_status: Partial

  design.observability.observation-semantic-model-v1:
    title: "Observation Semantic Model v1"
    path: technical/design/observability/observation-semantic-model-v1.md
    domain: observation
    document_status: approved
    implementation_status: partial
    architecture_scope: TARGET
    implementation_evidence:
      evaluated_on: "2026-10-09"
      basis:
        observation: 397c0b4691b5
      tests:
        - "observation:tests/test_semantic_model.py"
        - "observation:tests/test_plane.py"
      observed: >
        Evaluated section by section against observation:src/observation/semantic.py
        and observation:src/observation/plane.py; both test files pass in an
        extraction of that revision (22 and 16 test cases) and code-only
        statements were confirmed by ad hoc runs.
        Section 2 (claim and atomicity): realised in shape. A claim has one
        family, hence one authority, one subject, one epistemic kind and an
        opaque value that may be structured; a plane message wraps exactly
        one observation.
        Section 3 (subject, scope, identity): realised. Identities are typed
        and issuer-scoped with optional scope and lifetime; cross-domain
        association is an explicit link with asserted, conflict and
        unresolved states; a local key is documented as not a stable
        identity. Tested.
        Section 4 (authority, producer, asserter): realised as separate
        fields, with a measurement source; the enumeration has the four
        authorities plus Lab, and no Modality; a Lab-authority claim must be
        of kind lab_derived. Tested, except the absence of Modality.
        Section 5 (epistemic basis, availability): realised in part.
        Conditions distinguish availability from completeness and source
        origin from plane origin, and are read back separately. Tested.
        Section 6 (domain time): realised in part. Time references are typed
        per authority; primary time must name the claim's authority and
        other domains' time is context; booleans, non-finite values and
        three delivery-sequence kinds are refused. Tested.
        Section 7 (lineage): realised in shape: parent references and a
        transformation with identifier, revision and effective
        configuration; a transformation requires parents.
        Section 8 (family, revision): realised for identity: family path,
        contract identifier and revision are independent of any transport,
        and the plane keeps different contracts and revisions apart. Tested.
        Section 9 (measurement source): realised as an optional field.
        Section 10 (replay): the plane replays the same retained
        observations by delivery sequence and re-executes nothing.
        Section 11 (delivery): the documentation of open_stream declares
        ordering scope, duplication, gap signalling, completeness and resume
        for the in-memory plane; loss is signalled by an explicit rebase
        request, tested for expired replay, bootstrap overflow and consumer
        overflow.
        Section 13 (non-goals): the package defines no record layout, wire
        format, endpoint, storage or transport.
      limits: >
        The module's statement that it implements the model is its own
        description and is not counted as evidence. The checks are on
        labels (finding F-0046): the epistemic bases and availability states
        of section 5 are not encoded, both being free tokens apart from
        lab_derived; lab_derived is accepted under any authority and the
        asserter is not tied to the authority; primary time is checked by
        domain only and wall-clock kinds are not refused; a derived claim
        needs no lineage and parent references are unresolved text.
        The code is silent on: units, reference frames and part identity
        (section 8), which can only live in the opaque value; revision
        compatibility (section 8); observation identity (section 3); what
        STALE is stale against (section 5); snapshot coherence scope
        (section 10); and evidence admission (section 12), for which only a
        separate run-context field exists. No semantic family or contract is
        defined, and none is authorized by the model. No code attaches a
        plane-origin condition. Against section 11: delivery is at most
        once, which the module declares (F-0047), and a run boundary is not
        signalled to a consumer that reconnects after it (F-0040). Claim
        values are held by reference and are mutable (F-0041). Nothing
        publishes to the plane outside its tests (F-0044), so no claim from
        a real authority has been seen in these types. Passing tests show
        construction of values, not use.
    decision:
      reference: "Architecture Owner decision recorded in the document's status line"
      date: "2026-10-09"
    source:
      repository: symbiont-lab
      commit: cfa137e167081acac3590fb52ae069adfda605d4
      path: docs/design/observability/observation-semantic-model-v1.md
      register_entry: "Architecture Owner approved the transport-independent conceptual semantics on 2026-10-09. The model resolves claim atomicity, typed subject/identity, authority/epistemic basis, domain time/revision, provenance, availability, family/revision, units/frames, snapshots/replay, delivery principles, and scientific evidence admission. Semantic-family contracts may proceed; later record/envelope design remains separate. Observation #3's transport-neutral primitives are integrated without selecting the final record/wire/API/transport/storage contract; no cutover is authorized."
      document_status: Approved
      implementation_status: Not started
    editorial_notes: >
      Approved as a conceptual model only. The document states that concrete
      record, delivery, schema, transport and storage decisions are not
      authorized by it. It refines the Observation Architecture v1 target
      design, which is recorded here as HISTORICAL and superseded. Its own section on authority
      names Organism and World among the authorities and says Modality does
      not automatically become one, which agrees with ADR-0095 and ADR-0099
      and differs from the list in that target design.

  design.observability.observation-architecture-target-design-v1:
    title: "Observation Architecture v1 — Target Design"
    path: technical/design/observability/observation-architecture-target-design-v1.md
    domain: observation
    participating_domains: [lab]
    document_status: superseded
    implementation_status: not_applicable
    architecture_scope: HISTORICAL
    superseded_by: design.observation.observation-architecture-biopeia-v1
    superseded_by_decisions:
      - "docs:technical/adr/ADR-0095-surviving-semantic-authorities.md"
      - "docs:technical/adr/ADR-0099-modality-contract-library.md"
      - "docs:technical/adr/ADR-0100-observation-capability-and-evidence-custody.md"
      - "docs:technical/adr/ADR-0085-project-identity-is-biopeia-and-the-individual-is-organism.md"
    disposition:
      by: Architecture Owner
      date: "2026-10-09"
      reference: "https://github.com/biopeia/docs/pull/8#pullrequestreview-5473645274"
      statement: >
        No longer a valid Biopeia TARGET design. Preserved unchanged as
        evidence of the earlier design state; not to be rewritten to repair
        it. When this was decided no design replaced it; the Observation
        Architecture for Biopeia v1, written new and approved later the same
        day, now does.
    decision:
      reference: "Architecture-owner disposition recorded in the document's status line"
      date: "2026-10-07"
    source:
      repository: symbiont-lab
      commit: cfa137e167081acac3590fb52ae069adfda605d4
      path: docs/design/observability/observation-architecture-target-design-v1.md
      register_entry: "Architecture owner approved with refinements on 2026-10-07 for target direction/boundaries: domain-owned observation production with Lab-owned operational coordination/materialization/delivery (Option C), observation-oriented/event-delivered where needed, explicit identity/time/lineage, consumer-driven coherence and full replacement. Project owner froze this macro-architecture slice on 2026-10-08; the Observation Semantic Model v1 is now approved conceptually, while semantic-family contracts, concrete record/envelope design, family-specific identity/time/provenance representation, snapshots/replay/delivery and transport remain open. Embodiment accepted the backend-neutral Physical Body Pose semantic contract with refinements; project-owner unit disposition excludes any Physics3D capability with implicit/unknown units until explicit declaration or conversion to metres is demonstrated. Observation #3's transport-neutral primitives are integrated; no concrete family schema, delivery API, transport, storage, or cutover is approved."
      document_status: Approved
      implementation_status: Not started
    editorial_notes: >
      Approved on 2026-10-07 as the target for operational observation in the
      source repository, two days before the Biopeia Architecture v1 baseline
      (ADR-0095 to ADR-0110) was ratified. Copied because the semantic model
      depends on it. Reviewed against that baseline on 2026-10-09, and
      classed HISTORICAL and superseded by the Architecture Owner on the same
      day; the findings of that review follow.
      Direct conflicts, both in its section 4.1: it lists Modality among the
      authority domains, while ADR-0099 ratifies Modality as a contract,
      library or capability and not an independent semantic authority; and it
      classes World as a subject or context identity and not an authority
      domain, while ADR-0095 ratifies World as one of the four semantic
      authorities. It also names the organism Symbiont, against ADR-0085.
      Tension, not contradiction: it assigns operational coordination,
      materialization and delivery of observations to Lab and defers a
      standalone package, while ADR-0100 treats Observation as a passive
      capability with transport as application or infrastructure, and Biopeia
      already has a separate observation repository holding the plane.
      Compatible: its rule against hidden transfer of authority, the
      distinction between a semantic claim and its delivery, and the limit of
      Lab authority to meaning Lab itself creates.

  design.observation.observation-architecture-biopeia-v1:
    title: "Observation Architecture for Biopeia v1"
    path: technical/design/observation/observation-architecture-biopeia-v1.md
    domain: observation
    participating_domains: [organism, embodiment, environment, world, lab, modality]
    document_status: approved
    implementation_status: partial
    architecture_scope: TARGET
    implementation_evidence:
      evaluated_on: "2026-10-09"
      basis:
        observation: 397c0b4691b5
        organism: 6543188
        embodiment: a5129f0
        environment: f97ec22
        world: c162b67
        modality: 9bd1b77
        lab: 4d5ff70
      tests:
        - "observation:tests/test_plane.py"
        - "observation:tests/test_semantic_model.py"
        - "observation:tests/test_projection.py"
      verified_independently: >
        The coordinator re-checked this evaluation against observation
        397c0b4691b5 on 2026-10-09, separately from the agent that wrote it:
        the three test files pass (44 cases); the authority enumeration has
        exactly ORGANISM, EMBODIMENT, ENVIRONMENT, WORLD and LAB; no source
        module of observation imports another domain; among the other
        repositories only lab's source imports observation, and only its
        inherited projection; no ObservationPlane is constructed outside
        observation's own tests; a value mutated by its producer after
        publication is seen mutated in the plane's current view (F-0041);
        and a delivery-sequence kind is refused as domain time.
      observed: >
        Evaluated point by point against the observation repository; its
        three test files pass in an extraction of that revision (44 test
        cases) and code-only statements were confirmed by ad hoc runs. The
        other repositories were searched, not tested, at the revisions in
        the basis above; only observation was evaluated as an
        implementation.
        P1 (five roles): realised in part. Authority, asserter, producer and
        measurement source are separate fields of an observation and the
        authority comes only from the claim's family
        (observation:src/observation/semantic.py; tested). The plane is a
        distinct object that holds claims without becoming their authority.
        P2 (the plane belongs to Observation): realised. The plane is
        observation:src/observation/plane.py; no plane was found in lab. The
        module documentation that said Lab hosts it was corrected in
        observation 25b6738 and now names the Observation capability.
        P3 (authorities do not depend on Observation): realised for the
        dependency direction of source packages. No source package of
        organism, embodiment, environment, world or modality imports
        observation, and observation imports only the standard library. This
        rests on a text search, not a test.
        P4 (no path to causal state): no such path was found. The package
        has no call into a producer, holds no reference to one and contains
        no control operation.
        P5 (coherence and sequence): realised for the sequence. The delivery
        sequence is carried on the plane message, outside the observation,
        and the claim model refuses delivery-sequence kinds as domain time
        (tested).
        P6 (transduced claims): realised only negatively: the authority
        enumeration has no Modality member (ad hoc run, no test).
        P7 (live replay is not evidence): nothing contradicts it. Replay is a
        fixed-length in-memory queue, the module states it is not durable,
        and nothing writes it anywhere.
        P8 (inherited projection is transitional): the stated condition for
        deferral holds, in that callers exist (lab source, one world
        integration test) and no TARGET family exists to replace it; the
        README and migration record state in prose that it is no
        compatibility promise.
      limits: >
        P1: consumer and evidence custodian have no representation in code,
        and nothing checks that the party named in a role holds it (F-0046).
        P3: the adapter layer the design draws does not exist; nothing
        publishes to the plane outside its tests (F-0044). World's
        integration tests, through a test-only extra, import
        observation.semantic and build observations inside the world
        repository; whether that counts as an authority depending on the
        package is not decided here. P4: observations are held and delivered
        by reference with mutable claim values, so a consumer could alter
        what a producer handed over (F-0041); no test examines flow from a
        consumer back to a producer (F-0043); with no control path in the
        package, the separation of observing and controlling is untested
        rather than shown. P5: the code is silent on coherence. No type
        declares a coherence scope or links a set of claims to a World
        causal cut, and the current view is ordered by publication, not by
        domain time (F-0045). P6: silent on naming the owner of what is
        transduced; no family exists. P7: silent on the hand-over to an
        evidence custodian; a run boundary is not signalled to a consumer
        that reconnects after it (F-0040). P8: not realised in code: the
        projection and frame carry no transitional mark and are exported
        from the top of the package (F-0042); whether its callers are
        necessary consumers is not decided here. No point was found
        contradicted by the code. The callers in lab and world pin
        observation cb07ace, where projection.py and contracts.py are
        identical to the revision evaluated. Passing tests are not evidence
        of use in a running system.
    decision:
      reference: "Architecture Owner approval of 2026-10-09, recorded in section 7 of the document"
      date: "2026-10-09"
    editorial_notes: >
      Written new on 2026-10-09 from the ratified decision records, the
      approved Observation Semantic Model v1 and the observation repository at
      cb07ace. Approved by the Architecture Owner the same day, after three of
      its points were decided in answer to questions it posed. The approval
      keeps the implementation status not evaluated: approving the design
      does not mean the observation repository implements it.
      Evaluated afterwards, the same day, against observation 397c0b4 and
      recorded as partial; the evidence block gives the result per point.
      Section 5 of the document describes cb07ace and is in part out of
      date: the module documentation it reports as saying that Lab hosts the
      plane was corrected in observation 25b6738. The document was not
      edited.
