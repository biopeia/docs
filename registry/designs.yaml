schema_version: 1

# Design register. The only authority for the document status, implementation
# status and architecture scope of every design under technical/design/.
# Design documents do not carry these states themselves.
#
# implementation_status describes the Biopeia repositories. A state recorded in
# the source repository is kept under `source` as provenance and is never
# inherited: a copied design starts as not_evaluated.
#
# source.register_entry is the triage text of the design's row in the source
# register, verbatim. editorial_notes are written here and are not source text.
designs:

  design.runtime.biopeia-physical-step-integration-v1:
    title: "Biopeia Physical-Step and Causal-Commit Integration v1"
    path: technical/design/runtime/biopeia-physical-step-integration-v1.md
    domain: world
    participating_domains: [embodiment, environment, lab]
    document_status: approved
    implementation_status: not_evaluated
    architecture_scope: TARGET
    decision:
      reference: "docs:technical/adr/ADR-0073-biopeia-migration-causal-and-physical-contracts.md"
      date: "2026-10-09"
    source:
      repository: symbiont-lab
      commit: cfa137e167081acac3590fb52ae069adfda605d4
      path: docs/design/runtime/biopeia-physical-step-integration-v1.md
      register_entry: "Architecture-owner approved 2026-10-09 (ADR-0073): stable Embodiment command identity and descriptors; owner adoption of solver candidates; World-owned complete roster, durable owner-closed cuts and single logical writer; attributable Lab intervention with distinct intervention/run identities; and the minimum end-to-end physical causal-step milestone. World #10 and Embodiment #11 are integrated; Embodiment #13 adds owner-side adoption/checkpoint support. Lab #4 and the first integrated end-to-end slice remain incomplete. Observation Semantic Model v1 is approved conceptually; semantic-family contracts may proceed, but concrete schema/transport/storage remain unapproved."
      document_status: Approved
      implementation_status: Partial

  design.observability.observation-semantic-model-v1:
    title: "Observation Semantic Model v1"
    path: technical/design/observability/observation-semantic-model-v1.md
    domain: observation
    document_status: approved
    implementation_status: not_evaluated
    architecture_scope: TARGET
    decision:
      reference: "Architecture Owner decision recorded in the document's status line"
      date: "2026-10-09"
    source:
      repository: symbiont-lab
      commit: cfa137e167081acac3590fb52ae069adfda605d4
      path: docs/design/observability/observation-semantic-model-v1.md
      register_entry: "Architecture Owner approved the transport-independent conceptual semantics on 2026-10-09. The model resolves claim atomicity, typed subject/identity, authority/epistemic basis, domain time/revision, provenance, availability, family/revision, units/frames, snapshots/replay, delivery principles, and scientific evidence admission. Semantic-family contracts may proceed; later record/envelope design remains separate. Observation #3's transport-neutral primitives are integrated without selecting the final record/wire/API/transport/storage contract; no cutover is authorized."
      document_status: Approved
      implementation_status: Not started
    editorial_notes: >
      Approved as a conceptual model only. The document states that concrete
      record, delivery, schema, transport and storage decisions are not
      authorized by it. It refines the Observation Architecture v1 target
      design, whose scope is UNRESOLVED here.

  design.observability.observation-architecture-target-design-v1:
    title: "Observation Architecture v1 — Target Design"
    path: technical/design/observability/observation-architecture-target-design-v1.md
    domain: observation
    participating_domains: [lab]
    document_status: approved
    implementation_status: not_evaluated
    architecture_scope: UNRESOLVED
    decision:
      reference: "Architecture-owner disposition recorded in the document's status line"
      date: "2026-10-07"
    source:
      repository: symbiont-lab
      commit: cfa137e167081acac3590fb52ae069adfda605d4
      path: docs/design/observability/observation-architecture-target-design-v1.md
      register_entry: "Architecture owner approved with refinements on 2026-10-07 for target direction/boundaries: domain-owned observation production with Lab-owned operational coordination/materialization/delivery (Option C), observation-oriented/event-delivered where needed, explicit identity/time/lineage, consumer-driven coherence and full replacement. Project owner froze this macro-architecture slice on 2026-10-08; the Observation Semantic Model v1 is now approved conceptually, while semantic-family contracts, concrete record/envelope design, family-specific identity/time/provenance representation, snapshots/replay/delivery and transport remain open. Embodiment accepted the backend-neutral Physical Body Pose semantic contract with refinements; project-owner unit disposition excludes any Physics3D capability with implicit/unknown units until explicit declaration or conversion to metres is demonstrated. Observation #3's transport-neutral primitives are integrated; no concrete family schema, delivery API, transport, storage, or cutover is approved."
      document_status: Approved
      implementation_status: Not started
    editorial_notes: >
      Approved on 2026-10-07 as the target for operational observation in the
      source repository, two days before the Biopeia Architecture v1 baseline
      (ADR-0095 to ADR-0110) was ratified. It has not been reviewed against
      that baseline, in particular against ADR-0100, so it is not recorded as
      Biopeia TARGET. Copied because the semantic model depends on it.
