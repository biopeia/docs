[project]
name = "biopeia-docs"
version = "0.0.0"
description = "Biopeia explanatory documentation, documentation registry and tooling"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
