schema_version: 1

# Editorial style of the Biopeia publications. Rendering reads this file; the
# semantic projection never does. Changing a value here changes how a
# publication looks and nothing about what it says.
#
# Direction (Architecture Owner, 2026-10-10, biopeia/docs#80): scientific
# publication with technical specification, restrained institutional
# identity, high density, strong navigational hierarchy.

page:
  width_mm: 210
  height_mm: 297
  margin_mm: {top: 24, bottom: 22, left: 24, right: 22}

# `name` is written in the DOCX. `fallback` is what the PDF is always rendered
# with, so that page breaks do not depend on which typefaces a machine has.
fonts:
  text: {name: Aptos, fallback: Liberation Sans}
  code: {name: Consolas, fallback: Liberation Mono}
  # Characters the two fallbacks have no glyph for are set in this typeface, so
  # that no machine picks a substitute of its own. `ranges` are Unicode blocks
  # (hex). A character outside them that the fallbacks lack fails the build.
  symbols: {name: DejaVu Sans, fallback: DejaVu Sans, ranges: ["2070-209F", "25A0-25FF"]}

# Hex RGB. One accent, taken from the dark blue of the Biopeia mark. Nothing
# is told by colour alone; everything reads in greyscale.
colours:
  text: "1B1F24"
  secondary: "5B6570"
  rule: "C5CAD1"
  shade: "F2F3F5"
  accent: "0B4F8A"

# Points.
sizes:
  cover_brand: 44
  cover_title: 17
  part: 26
  chapter: 19
  section: 13.5
  subsection: 11
  body: 10
  list: 10
  table: 8.5
  code: 8.5
  caption: 8.5
  meta: 8
  kicker: 9

# Whether each chapter opens a new page. When false, chapters follow one
# another inside their part and only parts open a page: fewer pages that hold
# the last two lines of a chapter and nothing else.
layout:
  chapter_starts_page: false
  # A table goes on landscape pages of its own only when it is genuinely wide
  # and large enough to fill them: at least this many columns and this many
  # characters. Everything else stays in the flow of the text.
  landscape_min_columns: 6
  landscape_min_characters: 1200

# The mark is a file of this repository. A build never fetches it from
# anywhere, so a past build keeps its identity whatever happens elsewhere.
logo:
  path: publication/assets/biopeia-logo.png
  width_mm: 30

# The cover is one block: mark, name, title and type, then the edition,
# release and date close beneath it. `top_space_mm` sets the block a little
# above the middle of the page.
cover:
  top_space_mm: 62
  mark_gap_mm: 14
  metadata_gap_mm: 16

# Layout checks on the rendered PDF, counted in characters of body text
# (running header and footer left out). The build fails on:
#   - any page under `blank_page_chars`: an orphaned line or two;
#   - a page under `sparse_page_chars` that is not the last page of its part
#     or appendix: whitespace in the middle of running text is a defect,
#     while a short last page is how a section ends;
#   - more than `max_sparse_share` of the pages being sparse.
# Sparse pages and the fullest page are reported in the build manifest.
# Do not lower these to make a build pass: fix the layout.
qa:
  blank_page_chars: 120
  sparse_page_chars: 400
  max_sparse_share: 0.10
