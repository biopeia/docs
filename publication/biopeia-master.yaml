schema_version: 1

# Composition of the main Biopeia publication. This file holds no documentary
# text: it names sources and the order in which they are presented. The corpus
# says what is known, the registry says where it comes from and what state it
# is in, and this file says how one publication is assembled from them.
publication:
  id: biopeia-master
  title: Biopeia
  subtitle: Architecture, Artificial Life and Autonomous Organisms
  type: Technical and Scientific Reference
  output: Biopeia-Master

# Front matter that follows the contents list and precedes Part I.
front:
  - id: reader-guide
    title: Reader guide
    generated: [reader-guide]
  # What has been decided about the whole, before any part is described.
  - id: executive-architecture
    title: Executive architecture
    chapters:
      - explanation/biopeia/what-biopeia-is.md

# Each part lists `chapters` (documents of this repository, in reading order)
# and/or `generated` sections (rendered from the registry by
# tools/publication/projection.py).
parts:
  # What the project sets out to find out, then how one step crosses the
  # domains today, including what is joined only in tests, then the domains.
  - id: biopeia
    title: Biopeia
    chapters:
      - explanation/biopeia/research-hypotheses.md
      - explanation/biopeia/one-step-across-the-domains.md
    generated: [domains]

  - id: organism
    title: Organism
    chapters:
      - explanation/organism/life-of-an-organism.md
      - explanation/organism/foundation-conventions.md
      - explanation/organism/identity-and-checkpoint.md
      - explanation/organism/transition-and-continuation.md
      - explanation/organism/genome-and-inheritance.md
      - explanation/organism/cognitive-graph.md
      - explanation/organism/graph-plasticity.md
      - explanation/organism/generative-resident.md
      - explanation/organism/attention-allocation.md
      - explanation/organism/experience-record-and-ledger.md
      - explanation/organism/causal-evidence-and-controllability.md
      - explanation/organism/causal-provenance-log.md
      - explanation/organism/capacity-pressure-and-pair-statistics.md
      - explanation/organism/competence-development.md
      - explanation/organism/prospective-deliberation.md
      - explanation/organism/execution-binding-and-affordances.md
      - explanation/organism/action-path.md
      - explanation/organism/actuator-evidence.md
      - explanation/organism/executive-outcome-ledger.md
      - explanation/organism/cognitive-checkpoint.md
      - explanation/organism/sense-to-checkpoint-transition.md

  - id: embodiment
    title: Embodiment
    chapters:
      - explanation/embodiment/articulated-body.md
      - explanation/embodiment/physical-state.md
      - explanation/embodiment/somatic-state.md
      - explanation/embodiment/physical-projection.md
      - explanation/embodiment/actuation-projection.md

  - id: environment
    title: Environment
    chapters:
      - explanation/environment/static-scene.md
      - explanation/environment/resource-geometry.md
      - explanation/environment/finite-resource.md
      - explanation/environment/dynamic-state.md
      - explanation/environment/procedural-genesis.md

  - id: world
    title: World
    chapters:
      - explanation/world/genesis-and-rosters.md
      - explanation/world/causal-manifest.md
      - explanation/world/causal-journal.md
      - explanation/world/in-memory-runtime.md
      - explanation/world/durable-runtime.md
      - explanation/world/journal-snapshot-store.md
      - explanation/world/physical-step.md
      - explanation/world/recovery.md

  - id: modality-observation
    title: Modality and Observation
    chapters:
      - explanation/modality/current-state.md
      - explanation/observation/observation-plane.md
      - explanation/observation/semantic-claim-model.md
      - explanation/observation/inherited-projection.md

  - id: lab
    title: Lab
    chapters:
      - explanation/lab/study-utilities.md
      - explanation/lab/body-interoception-transducer.md
      - explanation/lab/operator-material-transfer.md

  - id: cross-domain
    title: Cross-domain architecture
    generated: [contracts]

appendices:
  - id: components
    title: Canonical component catalog
    generated: [components]
  - id: contracts
    title: Cross-domain contract catalog
    generated: [contract-catalog]
  - id: glossary
    title: Glossary
    generated: [glossary]
  - id: notation-parameters-metrics
    title: Notation, parameters and metrics
    generated: [notation, parameters, metrics]
  - id: decisions
    title: Decision record index
    generated: [decisions]
  - id: designs
    title: Design index
    generated: [designs]
  - id: evidence
    title: Evidence semantics
    chapters:
      - reference/evidence-status.md

# Documents under explanation/ that this publication deliberately leaves out,
# each with its reason. A document that is neither a chapter nor listed here
# fails the build: nothing is dropped silently.
excluded: []
